        .horror-font { font-family: 'Creepster', cursive; }
        .nosifer { font-family: 'Nosifer', cursive; }
        #loader { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s; }
        .voodoo-container { width: 180px; height: 180px; border-radius: 50%; border: 3px solid var(--blood); overflow: hidden; box-shadow: 0 0 40px var(--blood); }
        .medusa-heart { width: 100%; height: 100%; object-fit: cover; animation: thump 1s infinite; }
        @keyframes thump { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } }
        #side-menu { position: fixed; top: 0; left: 0; bottom: 0; width: 300px; background: #000; border-right: 3px solid var(--blood); z-index: 4000; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .menu-open { transform: translateX(0) !important; box-shadow: 20px 0 60px #000; }
        .nav-active { border-bottom: 2px solid var(--blood); color: var(--blood) !important; }
        .movie-card { aspect-ratio: 2/3; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 2px solid transparent; background: #0a0a0a; position: relative; }
        .focusable:focus { outline: none; border-color: #fff !important; transform: scale(1.08); box-shadow: 0 0 25px rgba(229, 9, 20, 0.8); z-index: 50; }
        header { height: 45vh; background: linear-gradient(to bottom, transparent, var(--void)), url('IMG_8238.jpeg') no-repeat center top; background-size: cover; display: flex; align-items: flex-end; padding: 40px; }
        .btn-play-blood { background: var(--blood); color: white; font-weight: 700; padding: 14px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 400px; }
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .episode-row { display: flex; gap: 15px; padding: 12px; border-bottom: 1px solid #111; cursor: pointer; border: 2px solid transparent; border-radius: 8px; }
        .ep-thumbnail { width: 120px; aspect-ratio: 16/9; background-size: cover; border-radius: 4px; flex-shrink: 0; background-color: #111; position: relative; }
        .ep-play-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); color: white; font-size: 1.2rem; }
        .movie-info { position: absolute; bottom: 0; background: rgba(0,0,0,0.85); width: 100%; padding: 8px; font-size: 0.75rem; opacity: 0; transition: 0.3s; }

        async function fetchTMDBFromIMDb(imdbId) {
            if (imdbCache.has(imdbId)) return imdbCache.get(imdbId);
            try {
                const res = await fetch(`https://api.themoviedb.org/3/find/${imdbId}?api_key=${API_KEY}&external_source=imdb_id`);

                if (data.movie_results && data.movie_results.length > 0) {

                    imdbCache.set(imdbId, result);
                    return result;
                } else if (data.tv_results && data.tv_results.length > 0) {
                    const result = { id: data.tv_results[0].id, type: 'tv' };
                    imdbCache.set(imdbId, result);
                    return result;
                }
            } catch (e) {}
            return null;

                if (tmdb && !idSet.has(tmdb.id)) {
                    try {
                        const res = await fetch(`https://api.themoviedb.org/3/${tmdb.type}/${tmdb.id}?api_key=${API_KEY}`);
                        const data = await res.json();
                        if (data && data.poster_path) {
                            idSet.add(tmdb.id);
                            return { ...data, media_type: tmdb.type, id: tmdb.id };
                        }
                    } catch (e) {}
                }
                return null;
            });
            const items = await Promise.all(promises);
            return items.filter(Boolean);
        }

        // ---- THE MASTER BATCH LOADER FOR IMDB IDS (RATE-LIMIT SAFE & TRUNCATION-PROOF) ----
        async function fetchStephenKingBatched(imdbIds, idSet) {
            const batchSize = 12; // Optimized chunking to load blazing fast without hitting TMDB 40/10s blocks
            for (let i = 0; i < imdbIds.length; i += batchSize) {
                const batch = imdbIds.slice(i, i + batchSize);
                
                const promises = batch.map(async (imdbId) => {
                    const tmdb = await fetchTMDBFromIMDb(imdbId);
                    if (tmdb && !idSet.has(tmdb.id)) {
                        try {
                            const res = await fetch(`https://api.themoviedb.org/3/${tmdb.type}/${tmdb.id}?api_key=${API_KEY}`);
                            if (res.ok) {
                                const data = await res.json();
                                if (data && data.poster_path) {
                                    idSet.add(tmdb.id);
                                    return { ...data, media_type: tmdb.type, id: tmdb.id };
                                }
                            }
                        } catch (e) {}
                    }
                    return null;
                });

                const items = await Promise.all(promises);
                const validItems = items.filter(Boolean);
                
                renderStephenKing(validItems, true);
                
                // 300ms delay perfectly balances lightning-fast UI loading and avoiding TMDB API penalties
                await new Promise(resolve => setTimeout(resolve, 300));
            }
        }

        async function openDetails(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`);
            const data = await res.json();
            currentMedia = { id, type, s: 1, e: 1, title: data.name || data.title, poster: data.poster_path };
            document.getElementById('show-title').innerText = currentMedia.title;
            document.getElementById('show-desc').innerText = data.overview || "";
            document.getElementById('show-year').innerText = (data.release_date || data.first_air_date || '').split('-')[0];
            document.getElementById('show-rating').innerText = data.vote_average ? data.vote_average.toFixed(1) : '★';
            document.getElementById('details-poster').src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
            document.getElementById('details-backdrop').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.backdrop_path})`;
            document.getElementById('media-type-tag').innerText = type.toUpperCase();
            const tvArea = document.getElementById('tv-controls');
            if (type === 'tv') { tvArea.classList.remove('hidden'); renderSeasons(data); } else { tvArea.classList.add('hidden'); }
            document.getElementById('main-app-wrapper').classList.add('hidden');
            document.getElementById('selector-overlay').classList.remove('hidden');
            window.scrollTo(0, 0);
            setTimeout(() => document.getElementById('main-play-trigger').focus(), 300);
        }

        function renderSeasons(data) {
            const container = document.getElementById('season-buttons'); container.innerHTML = '';
            if(!data.seasons) return;
            data.seasons.forEach(s => {
                if (s.season_number === 0) return;
                const btn = document.createElement('button');
                btn.className = "focusable px-6 py-2 bg-zinc-900 rounded horror-font text-lg border border-zinc-800 whitespace-nowrap";
                btn.innerText = `Season ${s.season_number}`;
                btn.onclick = () => loadEpisodes(data.id, s.season_number);
                container.appendChild(btn);
            });
            if(container.firstChild) container.firstChild.click();
        }

                epRow.className = "episode-row focusable"; epRow.tabIndex = 0;
                epRow.onclick = () => { currentMedia.s = seasonNum; currentMedia.e = e.episode_number; startLuxeStream(); };
                const thumb = e.still_path ? `https://image.tmdb.org/t/p/w300${e.still_path}` : '';
                epRow.innerHTML = `<div class="ep-thumbnail" style="background-image:url(${thumb})"><div class="ep-play-icon">▶</div></div><div class="flex-1"><div class="text-white font-bold">E${e.episode_number} ${e.name}</div><div class="text-zinc-500 text-xs line-clamp-1">${e.overview}</div></div>`;
                grid.appendChild(epRow);
            });
        }

        function startLuxeStream() {
            const { type, id, s, e } = currentMedia;
            const playerOverlay = document.getElementById('player-overlay');
            const iframe = document.getElementById('luxe-player');
            playerOverlay.style.display = 'block';
            iframe.src = (type === 'movie' ? `https://vidsrc.cc/v2/embed/movie/${id}` : `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}`);
            setTimeout(() => document.getElementById('close-player-btn').focus(), 500);
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
        function closeSelector() { document.getElementById('selector-overlay').classList.add('hidden'); document.getElementById('main-app-wrapper').classList.remove('hidden'); }
        function closePlayer() { document.getElementById('luxe-player').src = ""; document.getElementById('player-overlay').style.display = 'none'; }
        
        function setFilter(type, id = '') {
            activeType = type; activeID = id;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            if(event && event.target.tagName === 'BUTTON') event.target.classList.add('nav-active');
            fetchContent();
            document.getElementById('side-menu').classList.remove('menu-open');
            window.scrollTo(0,0);
        }

        function handleSearch(e) { if (e.key === 'Enter') { activeType = 'search'; activeID = e.target.value; fetchContent(); e.target.blur(); } }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace') {
                if (document.getElementById('player-overlay').style.display === 'block') closePlayer();
                else if (!document.getElementById('selector-overlay').classList.contains('hidden')) closeSelector();
            }
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const dir = e.key.replace('Arrow', '').toLowerCase();
                const next = findNext(document.activeElement, Array.from(document.querySelectorAll('.focusable')).filter(el => el.offsetParent !== null), dir);
                if (next) { next.focus(); next.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            }
        });

        function findNext(cur, targets, dir) {
            if (!cur || cur === document.body) return targets[0];
            const r1 = cur.getBoundingClientRect(), c1 = { x: r1.left + r1.width/2, y: r1.top + r1.height/2 };
            let best = null, min = Infinity;
            targets.forEach(t => {
                if (t === cur) return;
                const r2 = t.getBoundingClientRect(), c2 = { x: r2.left + r2.width/2, y: r2.top + r2.height/2 };
                if (dir === 'up' && c2.y >= c1.y) return; if (dir === 'down' && c2.y <= c1.y) return;
                if (dir === 'left' && c2.x >= c1.x) return; if (dir === 'right' && c2.x <= c1.x) return;
                const d = Math.sqrt(Math.pow(c2.x - c1.x, 2) + Math.pow(c2.y - c1.y, 2));
                if (d < min) { min = d; best = t; }
            });
            return best;
        }

        window.onload = () => {
            fetchContent();
            setTimeout(() => { 
                const loader = document.getElementById('loader');
                if(loader) { loader.style.opacity = '0'; setTimeout(()=>loader.remove(), 800); }
            }, 1200);
            const obs = new IntersectionObserver(e => { if(e[0].isIntersecting && activeType !== 'after_dark') fetchContent(true); });
            obs.observe(document.getElementById('sentinel'));
        };
    </script>
</body>
