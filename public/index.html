<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fear+ | The Final Ritual</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Metal+Mania&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --blood: #e50914; --void: #000; --ash: #1a1a1a; }

        body { 
            background: var(--void); color: white; font-family: 'Inter', sans-serif; 
            margin: 0; overflow-x: hidden; touch-action: pan-y; 
        }

        .horror-font { font-family: 'Creepster', cursive; }
        .nosifer { font-family: 'Nosifer', cursive; }
        
        #loader { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s; }
        .voodoo-container { width: 180px; height: 180px; border-radius: 50%; border: 3px solid var(--blood); overflow: hidden; box-shadow: 0 0 40px var(--blood); }
        .medusa-heart { width: 100%; height: 100%; object-fit: cover; animation: thump 1s infinite; }
        @keyframes thump { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } }

        #side-menu { 
            position: fixed; top: 0; left: 0; bottom: 0; width: 300px; 
            background: #000; border-right: 3px solid var(--blood); 
            z-index: 4000; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .menu-open { transform: translateX(0) !important; box-shadow: 20px 0 60px #000; }
        
        .nav-active { border-bottom: 2px solid var(--blood); color: var(--blood) !important; }

        .movie-card { 
            aspect-ratio: 2/3; border-radius: 8px; overflow: hidden; 
            cursor: pointer; transition: 0.3s; border: 2px solid transparent; 
            background: #0a0a0a;
        }
        
        .focusable:focus {
            outline: none;
            border-color: #fff !important;
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.8);
            z-index: 50;
        }

        header { 
            height: 45vh; 
            background: linear-gradient(to bottom, transparent, var(--void)), url('IMG_8238.jpeg') no-repeat center top; 
            background-size: cover; 
            display: flex; align-items: flex-end; padding: 40px;
        }

        .btn-play-blood { 
            background: var(--blood); color: white; font-weight: 700; 
            padding: 14px; border-radius: 12px; display: flex; align-items: center; 
            justify-content: center; gap: 10px; width: 100%; max-width: 400px; 
        }

        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .episode-row { display: flex; gap: 15px; padding: 12px; border-bottom: 1px solid #111; cursor: pointer; border: 2px solid transparent; border-radius: 8px; }
        .ep-thumbnail { width: 120px; aspect-ratio: 16/9; background-size: cover; border-radius: 4px; flex-shrink: 0; background-color: #111; position: relative; }
        .ep-play-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); color: white; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="voodoo-container"><img src="IMG_8259.jpeg" class="medusa-heart"></div>
        <h2 class="nosifer text-red-600 mt-6 text-xl">Entering the Ritual...</h2>
    </div>

    <!-- Sidebar: The Horror Vaults -->
    <div id="side-menu" class="p-8 no-scrollbar overflow-y-auto">
        <h2 class="nosifer text-red-600 text-2xl mb-8">THE VAULTS</h2>
        <div class="flex flex-col gap-2 horror-font text-xl">
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('person', 6650)">WES CRAVEN</button>
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('company', 1331)">DARK CASTLE</button>
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('black_horror')">BLACK HORROR</button>
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('youth')">YOUTH HORROR</button>
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('abroad')">HORROR FROM ABROAD</button>
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('person', 3027)">STEPHEN KING</button>
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('company', 3172)">BLUMHOUSE</button>
            <button class="focusable text-left py-3 mt-10 text-zinc-600" onclick="toggleMenu()">CLOSE [X]</button>
        </div>
    </div>

    <div id="main-app-wrapper">
        <header><h1 class="nosifer text-red-600 text-6xl md:text-8xl">FEAR+</h1></header>

        <div class="sticky top-0 z-[1000] bg-black/95 border-b border-zinc-900">
            <div class="flex items-center w-[95%] mx-auto gap-4 py-4">
                <button id="menu-btn" onclick="toggleMenu()" class="focusable text-red-600 text-3xl px-2">☰</button>
                <input type="search" id="search-input" 
                       class="focusable flex-1 bg-zinc-900 border border-zinc-800 rounded-lg py-3 px-6 text-white horror-font text-lg outline-none" 
                       placeholder="Search the Graves..." 
                       onkeyup="handleSearch(event)">
            </div>
            <nav class="flex px-6 pb-2 gap-8 overflow-x-auto no-scrollbar horror-font text-lg tracking-widest uppercase">
                <button id="btn-trending" onclick="setFilter('trending')" class="focusable nav-active whitespace-nowrap">LATEST BLOOD</button>
                <button class="focusable whitespace-nowrap" onclick="setFilter('horror_movies')">HORROR FILMS</button>
                <button class="focusable whitespace-nowrap" onclick="setFilter('horror_shows')">GHASTLY SERIES</button>
                <button class="focusable whitespace-nowrap" onclick="setFilter('unrated')">UNRATED</button>
            </nav>
        </div>

        <section id="continue-section" class="hidden px-6 pt-8">
            <h3 class="horror-font text-red-600 text-2xl mb-4 uppercase">Continue Ritual</h3>
            <div id="continue-grid" class="flex gap-4 overflow-x-auto no-scrollbar pb-4"></div>
        </section>

        <main id="movie-grid" class="p-6 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></main>
        <div id="sentinel" class="h-20"></div>
    </div>

    <div id="selector-overlay" class="hidden fixed inset-0 bg-black z-[5000] overflow-y-auto no-scrollbar">
        <div id="details-backdrop" class="absolute top-0 w-full h-[60vh] opacity-40 bg-cover bg-center filter blur-2xl"></div>
        <div class="relative z-10 p-6 max-w-5xl mx-auto">
            <button onclick="closeSelector()" class="focusable mb-8 bg-white/10 p-3 rounded-full border border-white/20">
                <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div class="flex flex-col md:flex-row gap-8 mb-10">
                <img id="details-poster" class="w-48 rounded-xl shadow-2xl border border-red-900/30">
                <div class="flex flex-col justify-end">
                    <h2 id="show-title" class="nosifer text-3xl md:text-5xl text-white mb-4 leading-tight"></h2>
                    <div class="flex items-center gap-4 horror-font text-xl text-zinc-400">
                        <span id="show-year"></span>
                        <span class="border border-red-600 text-red-600 px-2 py-1 rounded">★ <span id="show-rating"></span></span>
                        <span id="media-type-tag" class="text-zinc-500"></span>
                    </div>
                    <button id="main-play-trigger" onclick="startLuxeStream()" class="focusable btn-play-blood mt-6 horror-font text-2xl tracking-widest">▶ COMMENCE</button>
                </div>
            </div>
            <p id="show-desc" class="text-zinc-400 text-lg leading-relaxed mb-10 max-w-3xl"></p>
            <div id="tv-controls" class="hidden">
                <h3 class="horror-font text-red-600 text-2xl mb-4 uppercase">Epitaphs (Episodes)</h3>
                <div id="season-buttons" class="flex gap-3 overflow-x-auto no-scrollbar mb-6"></div>
                <div id="episode-grid" class="flex flex-col gap-2"></div>
            </div>
        </div>
    </div>

    <div id="player-overlay">
        <div class="absolute top-6 left-6 right-6 flex justify-between items-center z-[9001]">
            <div class="horror-font text-red-600 bg-black/80 px-4 py-2 rounded border border-red-900 uppercase">Now Consuming</div>
            <button id="close-player-btn" onclick="closePlayer()" class="focusable bg-red-600 text-white px-6 py-2 rounded font-bold">✕ CEASE</button>
        </div>
        <iframe id="luxe-player" class="w-full h-full" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <script>
        const API_KEY = 'b9c746781e1e9b084c4cc4f0420156d4';
        const HORROR_ID = 27;
        let activeType = 'trending', activeID = '', currentMedia = {};
        let currentPage = 1, isLoading = false;

        async function fetchContent(append = false) {
            if (isLoading) return;
            isLoading = true;
            if (!append) { currentPage = 1; document.getElementById('movie-grid').innerHTML = ''; }

            let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&page=${currentPage}&sort_by=popularity.desc`;
            
            if (activeType === 'trending') url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&page=${currentPage}`;
            else if (activeType === 'horror_shows') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=${HORROR_ID}&page=${currentPage}&sort_by=popularity.desc`;
            else if (activeType === 'unrated') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&certification_country=US&certification.gte=NC-17&page=${currentPage}`;
            
            // WES CRAVEN TOTAL VAULT LOGIC
            else if (activeType === 'person' && activeID === 6650) {
                url = `https://api.themoviedb.org/3/person/6650/combined_credits?api_key=${API_KEY}`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    let allCredits = [...data.cast, ...data.crew];
                    const uniqueCredits = Array.from(new Map(allCredits.map(item => [item.id, item])).values());
                    uniqueCredits.sort((a, b) => (b.release_date || b.first_air_date || '0').localeCompare(a.release_date || a.first_air_date || '0'));
                    renderGrid(uniqueCredits);
                    isLoading = false;
                    return; 
                } catch (err) { console.error(err); isLoading = false; return; }
            }

            else if (activeType === 'person') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&with_people=${activeID}&page=${currentPage}`;
            else if (activeType === 'company') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&with_companies=${activeID}&page=${currentPage}`;
            else if (activeType === 'black_horror') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&with_keywords=209825|260731|233306&page=${currentPage}`;
            else if (activeType === 'youth') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&certification_country=US&certification.lte=PG-13&page=${currentPage}`;
            else if (activeType === 'abroad') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&without_original_language=en&page=${currentPage}`;
            else if (activeType === 'search') url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${activeID}&page=${currentPage}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                const filtered = data.results.filter(item => 
                    (item.genre_ids && item.genre_ids.includes(HORROR_ID)) || (activeType === 'search' && item.genre_ids && item.genre_ids.includes(HORROR_ID))
                );
                renderGrid(filtered);
                currentPage++;
            } catch (err) { console.error(err); } finally { isLoading = false; }
        }

        function renderGrid(results) {
            const grid = document.getElementById('movie-grid');
            results.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = "movie-card focusable";
                card.tabIndex = 0;
                card.onclick = () => openDetails(m.id, m.media_type || (m.first_air_date ? 'tv' : 'movie'));
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover">`;
                grid.appendChild(card);
            });
        }

        async function openDetails(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`);
            const data = await res.json();
            currentMedia = { id, type, s: 1, e: 1, title: data.name || data.title, poster: data.poster_path };
            document.getElementById('show-title').innerText = currentMedia.title;
            document.getElementById('show-desc').innerText = data.overview || "The description has been redacted by the authorities.";
            document.getElementById('show-year').innerText = (data.release_date || data.first_air_date || '').split('-')[0];
            document.getElementById('show-rating').innerText = data.vote_average ? data.vote_average.toFixed(1) : '6.6';
            document.getElementById('details-poster').src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
            document.getElementById('details-backdrop').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.backdrop_path})`;
            document.getElementById('media-type-tag').innerText = type.toUpperCase();
            const tvArea = document.getElementById('tv-controls');
            if (type === 'tv') { tvArea.classList.remove('hidden'); renderSeasons(data); } else { tvArea.classList.add('hidden'); }
            document.getElementById('main-app-wrapper').classList.add('hidden');
            document.getElementById('selector-overlay').classList.remove('hidden');
            window.scrollTo(0, 0);
            setTimeout(() => document.getElementById('main-play-trigger').focus(), 300);
            saveToHistory(currentMedia);
        }

        function renderSeasons(data) {
            const container = document.getElementById('season-buttons');
            container.innerHTML = '';
            data.seasons.forEach(s => {
                if (s.season_number === 0) return;
                const btn = document.createElement('button');
                btn.className = "focusable px-6 py-2 bg-zinc-900 rounded horror-font text-lg border border-zinc-800 whitespace-nowrap";
                btn.innerText = `Ritual ${s.season_number}`;
                btn.onclick = () => loadEpisodes(data.id, s.season_number);
                container.appendChild(btn);
            });
            if(container.firstChild) container.firstChild.click();
        }

        async function loadEpisodes(showId, seasonNum) {
            const res = await fetch(`https://api.themoviedb.org/3/tv/${showId}/season/${seasonNum}?api_key=${API_KEY}`);
            const data = await res.json();
            const grid = document.getElementById('episode-grid');
            grid.innerHTML = '';
            data.episodes.forEach(e => {
                const epRow = document.createElement('div');
                epRow.className = "episode-row focusable";
                epRow.tabIndex = 0;
                epRow.onclick = () => { currentMedia.s = seasonNum; currentMedia.e = e.episode_number; startLuxeStream(); };
                const thumb = e.still_path ? `https://image.tmdb.org/t/p/w300${e.still_path}` : '';
                epRow.innerHTML = `<div class="ep-thumbnail" style="background-image:url(${thumb})"><div class="ep-play-icon">▶</div></div><div class="flex-1"><div class="text-white font-bold">E${e.episode_number} ${e.name}</div><div class="text-zinc-500 text-xs line-clamp-1">${e.overview}</div></div>`;
                grid.appendChild(epRow);
            });
        }

        function startLuxeStream() {
            const { type, id, s, e } = currentMedia;
            const playerOverlay = document.getElementById('player-overlay');
            const iframe = document.getElementById('luxe-player');
            playerOverlay.style.display = 'block';
            iframe.src = (type === 'movie' ? `https://vidsrc.cc/v2/embed/movie/${id}` : `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}`);
            setTimeout(() => document.getElementById('close-player-btn').focus(), 500);
        }

        function saveToHistory(item) {
            let history = JSON.parse(localStorage.getItem('fear_history_v2') || '[]');
            history = history.filter(x => x.id !== item.id);
            history.unshift(item);
            localStorage.setItem('fear_history_v2', JSON.stringify(history.slice(0, 10)));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('fear_history_v2') || '[]');
            const section = document.getElementById('continue-section');
            const grid = document.getElementById('continue-grid');
            if (history.length === 0) return;
            section.classList.remove('hidden');
            grid.innerHTML = '';
            history.forEach(item => {
                const card = document.createElement('div');
                card.className = "min-w-[110px] max-w-[110px] cursor-pointer focusable movie-card";
                card.tabIndex = 0;
                card.onclick = () => openDetails(item.id, item.type);
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w300${item.poster}" class="w-full h-full object-cover">`;
                grid.appendChild(card);
            });
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
        function closeSelector() { document.getElementById('selector-overlay').classList.add('hidden'); document.getElementById('main-app-wrapper').classList.remove('hidden'); }
        function closePlayer() { document.getElementById('luxe-player').src = ""; document.getElementById('player-overlay').style.display = 'none'; }
        
        function setFilter(type, id = '') {
            activeType = type; activeID = id;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            if(event && event.target.tagName === 'BUTTON') event.target.classList.add('nav-active');
            fetchContent();
            document.getElementById('side-menu').classList.remove('menu-open');
            window.scrollTo(0,0);
        }

        function handleSearch(e) { if (e.key === 'Enter') { activeType = 'search'; activeID = e.target.value; fetchContent(); e.target.blur(); } }

        document.addEventListener('keydown', function(e) {
            const current = document.activeElement;
            const focusables = Array.from(document.querySelectorAll('.focusable')).filter(el => el.offsetParent !== null);
            if (e.key === 'Backspace' || e.keyCode === 10009) {
                e.preventDefault();
                if (document.getElementById('player-overlay').style.display === 'block') closePlayer();
                else if (!document.getElementById('selector-overlay').classList.contains('hidden')) closeSelector();
                else if (document.getElementById('side-menu').classList.contains('menu-open')) toggleMenu();
            }
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const dir = e.key.replace('Arrow', '').toLowerCase();
                const next = findNext(current, focusables, dir);
                if (next) { next.focus(); next.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            }
        });

        function findNext(cur, targets, dir) {
            if (!cur || cur === document.body) return targets[0];
            const r1 = cur.getBoundingClientRect(), c1 = { x: r1.left + r1.width/2, y: r1.top + r1.height/2 };
            let best = null, min = Infinity;
            targets.forEach(t => {
                if (t === cur) return;
                const r2 = t.getBoundingClientRect(), c2 = { x: r2.left + r2.width/2, y: r2.top + r2.height/2 };
                if (dir === 'up' && c2.y >= c1.y) return; if (dir === 'down' && c2.y <= c1.y) return;
                if (dir === 'left' && c2.x >= c1.x) return; if (dir === 'right' && c2.x <= c1.x) return;
                const d = Math.sqrt(Math.pow(c2.x - c1.x, 2) + Math.pow(c2.y - c1.y, 2));
                if (d < min) { min = d; best = t; }
            });
            return best;
        }

        window.onload = () => {
            fetchContent();
            renderHistory();
            setTimeout(() => { document.getElementById('loader').style.opacity = '0'; setTimeout(()=>document.getElementById('loader').remove(), 800); }, 1200);
            const mc = new Hammer(document.body);
            mc.on("swiperight", () => toggleMenu());
            const obs = new IntersectionObserver(e => { if(e[0].isIntersecting) fetchContent(true); });
            obs.observe(document.getElementById('sentinel'));
        };
    </script>
</body>
</html>
