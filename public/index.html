        async function fetchWithRetry(url, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return await res.json();
                    if (res.status === 429) { await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1))); continue; }
                    break;
                } catch(e) { if (i === retries - 1) return null; await new Promise(resolve => setTimeout(resolve, 500)); }
            }
            return null;
        }

        async function fetchTMDBFromIMDb(imdbId) {
            try {
                const data = await fetchWithRetry(`https://api.themoviedb.org/3/find/${imdbId}?api_key=${API_KEY}&external_source=imdb_id`);
                if (data?.movie_results?.length > 0) return { id: data.movie_results[0].id, type: 'movie' };
                else if (data?.tv_results?.length > 0) return { id: data.tv_results[0].id, type: 'tv' };
            } catch (e) {} return null;
        }

        async function resolveItemsFromImdbList(imdbIds, idSet) {
            const promises = imdbIds.map(async (imdbId) => {
                const tmdb = await fetchTMDBFromIMDb(imdbId);
                if (tmdb && !idSet.has(tmdb.id)) {
                    const data = await fetchWithRetry(`https://api.themoviedb.org/3/${tmdb.type}/${tmdb.id}?api_key=${API_KEY}`);
                    if (data?.poster_path) { idSet.add(tmdb.id); return { ...data, media_type: tmdb.type, id: tmdb.id }; }

            });

                else {
                    const data = await fetchWithRetry(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&certification_country=US&certification.lte=PG-13&page=${youthHorrorPage}`);
                    results = data?.results?.filter(i => i.poster_path && !loadedYouthHorrorIds.has(i.id)) || [];
                    results.forEach(i => loadedYouthHorrorIds.add(i.id)); youthHorrorPage++;
                }
            } else if (activeType === 'teen') {
                const data = await fetchWithRetry(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&with_keywords=12339|9826&certification_country=US&certification.gte=PG-13&page=${teenHorrorPage}`);
                results = data?.results?.filter(i => i.poster_path && !loadedTeenHorrorIds.has(i.id)) || [];
                results.forEach(i => loadedTeenHorrorIds.add(i.id)); teenHorrorPage++;
            } else {
                const url = activeType === 'list' ? `https://api.themoviedb.org/3/list/${activeID}?api_key=${API_KEY}&page=${currentPage}` : `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&page=${currentPage}`;
                const data = await fetchWithRetry(url);
                results = data?.results || data?.items || [];
                currentPage++;
            }
            renderGrid(results);
            isLoading = false;
        }

        function renderGrid(results) {
            const grid = document.getElementById('movie-grid');
            results.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = "movie-card focusable fade-in"; card.tabIndex = 0;
                card.onclick = () => openDetails(m.id, m.media_type || 'movie');
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover"><div class="movie-info horror-font"><h3 class="text-red-600 font-bold truncate">${m.title || m.name}</h3><p>${(m.release_date || m.first_air_date || '').split('-')[0]}</p></div>`;
                grid.appendChild(card);
            });
        }

        function openDetails(id, type) {
            window.location.hash = `details/${type}/${id}`;
            fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`).then(r => r.json()).then(data => {
                currentMedia = { id, type, title: data.name || data.title };
                document.getElementById('show-title').innerText = currentMedia.title;
                document.getElementById('show-desc').innerText = data.overview;
                document.getElementById('details-poster').src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
                document.getElementById('selector-overlay').classList.remove('hidden');
                document.getElementById('main-app-wrapper').classList.add('hidden');
            });
        }

        function startLuxeStream() {
            const { type, id } = currentMedia;
            document.getElementById('player-overlay').style.display = 'block';
            document.getElementById('luxe-player').src = `https://vidsrc.pm/embed/${type}/${id}`;
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
        function closeSelector() { document.getElementById('selector-overlay').classList.add('hidden'); document.getElementById('main-app-wrapper').classList.remove('hidden'); }
        function closePlayer() { document.getElementById('luxe-player').src = "about:blank"; document.getElementById('player-overlay').style.display = 'none'; }
        
        function setFilter(type, id = '') {
            activeType = type; activeID = id;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            fetchContent(); document.getElementById('side-menu').classList.remove('menu-open');
        }

        window.onload = () => {
            fetchContent();
            const obs = new IntersectionObserver(e => { if(e[0].isIntersecting) fetchContent(true); });
            obs.observe(document.getElementById('sentinel'));
        };
    </script>
</body>
</html>
