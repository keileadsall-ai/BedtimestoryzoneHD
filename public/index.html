        .nosifer { font-family: 'Nosifer', cursive; }
        #loader { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s; }

        @keyframes thump { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } }
        #side-menu { position: fixed; top: 0; left: 0; bottom: 0; width: 300px; background: #000; border-right: 3px solid var(--blood); z-index: 4000; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        .nav-active { border-bottom: 2px solid var(--blood); color: var(--blood) !important; }
        .movie-card { aspect-ratio: 2/3; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 2px solid transparent; background: #0a0a0a; position: relative; }
        .focusable:focus { outline: none; border-color: #fff !important; transform: scale(1.08); box-shadow: 0 0 25px rgba(229, 9, 20, 0.8); z-index: 50; }
        header { height: 45vh; background: linear-gradient(to bottom, transparent, var(--void)), url('IMG_8238.jpeg') no-repeat center top; background-size: cover; display: flex; align-items: flex-end; padding: 40px; }
        .btn-play-blood { background: var(--blood); color: white; font-weight: 700; padding: 14px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 400px; }
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .episode-row { display: flex; gap: 15px; padding: 12px; border-bottom: 1px solid #111; cursor: pointer; border: 2px solid transparent; border-radius: 8px; }
        .ep-thumbnail { width: 120px; aspect-ratio: 16/9; background-size: cover; border-radius: 4px; flex-shrink: 0; background-color: #111; position: relative; }
        .ep-play-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); color: white; font-size: 1.2rem; }
        .movie-info { position: absolute; bottom: 0; background: rgba(0,0,0,0.85); width: 100%; padding: 8px; font-size: 0.75rem; opacity: 0; transition: 0.3s; }
        .movie-card:hover .movie-info { opacity: 1; }
        
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        async function fetchWithRetry(url, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return await res.json();
                    if (res.status === 429) {
                        await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1))); 
                        continue;
                    }
                    break;
                } catch(e) {
                    if (i === retries - 1) return null;
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
            }
            return null;
        }

        const imdbCache = new Map();
        async function fetchTMDBFromIMDb(imdbId) {
            if (imdbCache.has(imdbId)) return imdbCache.get(imdbId);
            try {
                const data = await fetchWithRetry(`https://api.themoviedb.org/3/find/${imdbId}?api_key=${API_KEY}&external_source=imdb_id`);
                if (data && data.movie_results && data.movie_results.length > 0) {
                    const result = { id: data.movie_results[0].id, type: 'movie' };
                    imdbCache.set(imdbId, result);
                    return result;
                } else if (data && data.tv_results && data.tv_results.length > 0) {
                    const result = { id: data.tv_results[0].id, type: 'tv' };
                    imdbCache.set(imdbId, result);
                    return result;
                }
            } catch (e) {}
            return null;
        }

        async function resolveItemsFromImdbList(imdbIds, idSet) {
            const promises = imdbIds.map(async (imdbId) => {
                const tmdb = await fetchTMDBFromIMDb(imdbId);
                if (tmdb && !idSet.has(tmdb.id)) {
                    try {
                        const data = await fetchWithRetry(`https://api.themoviedb.org/3/${tmdb.type}/${tmdb.id}?api_key=${API_KEY}`);
                        if (data && data.poster_path) {
                            idSet.add(tmdb.id);
                            return { ...data, media_type: tmdb.type, id: tmdb.id };
                        }
                    } catch (e) {}
                }
                return null;
            });
            const items = await Promise.all(promises);
            return items.filter(Boolean);
        }

                    let targetUrl = isMoviePage ? 
                        `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&certification_country=US&certification.lte=PG-13&page=${pageTarget}` :
                        `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=10765&certification_country=US&certification.lte=TV-14&page=${pageTarget}`;
                    const data = await fetchWithRetry(targetUrl);
                    let fetched = (data?.results || []).filter(item => 
                        item.poster_path && 
                        !loadedYouthHorrorIds.has(item.id)
                    ).map(item => ({ ...item, media_type: item.media_type || (item.first_air_date ? 'tv' : 'movie') }));
                    let unique = new Map();
                    fetched.forEach(item => { if (!unique.has(item.id)) { unique.set(item.id, item); loadedYouthHorrorIds.add(item.id); } });
                    results = Array.from(unique.values());
                }
            } else if (activeType === 'after_dark') {
                await fetchAfterDark();
                isLoading = false; return;
            } else if (activeType === 'unrated') {
                if (!append) {
                    loadedUnratedIds.clear();
                    results = await fetchExtremeMoviesInitial();
                } else {
                    results = await fetchExtremeMoviesMore(currentPage);
                }
            } else {
                let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&page=${currentPage}`;
                if (activeType === 'search') url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${activeID}&page=${currentPage}`;
                const data = await fetchWithRetry(url);
                results = data?.results || [];
            }

            renderGrid(results);
            if (!['black_magic', 'african'].includes(activeType)) currentPage++;
            isLoading = false;
        }

        async function fetchBlackMagicInitial() {
            const queries = [
                "The Haunting of", "The Possession of", "The Exorcism of",
                "David Blaine", "Criss Angel", "Ouija", "The Conjuring"
            ];
            const forbiddenGenres = [16, 35, 18, 10749, 9648, 53, 14];
            let promises = queries.map(q => 
                fetchWithRetry(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}`)
            );
            const responses = await Promise.all(promises);
            let items = [];
            
            responses.forEach(data => {
                if (data && data.results) {
                    data.results.forEach(item => {
                        if (item.genre_ids && item.genre_ids.some(g => forbiddenGenres.includes(g))) return;
                        if (item.media_type === 'person') return;
                        if (item.poster_path) items.push({...item, media_type: item.media_type || (item.first_air_date ? 'tv' : 'movie')});
                    });
                }
            });
            
            let unique = new Map();
            items.forEach(item => { if (!unique.has(item.id)) { unique.set(item.id, item); loadedBlackMagicIds.add(item.id); } });
            return Array.from(unique.values());
        }

        async function fetchBlackMagicMore(page) {
            const excludedGenres = "16,35,18,10749,9648,53,14";
            const magicKeywords = "11865|3254|3365|6152|10466"; 
            
            const urls = [
                `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&without_genres=${excludedGenres}&with_keywords=${magicKeywords}&sort_by=popularity.desc&page=${page}`,
                `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&without_genres=${excludedGenres}&with_keywords=${magicKeywords}&sort_by=popularity.desc&page=${page}`
            ];
            
            const responses = await Promise.all(urls.map(url => fetchWithRetry(url)));
            let items = [];
            responses[0]?.results && responses[0].results.forEach(m => { if (m.poster_path && !loadedBlackMagicIds.has(m.id)) items.push({...m, media_type:'movie'}); });
            responses[1]?.results && responses[1].results.forEach(t => { if (t.poster_path && !loadedBlackMagicIds.has(t.id)) items.push({...t, media_type:'tv'}); });
            
            let unique = new Map();
            items.forEach(item => { if (!unique.has(item.id)) { unique.set(item.id, item); loadedBlackMagicIds.add(item.id); } });
            return Array.from(unique.values());
        }

        async function fetchAfterDark() {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';
            const darkTitles = ["House on Haunted Hill", "Thir13en Ghosts", "Ghost Ship", "Gothika", "House of Wax", "The Reaping", "The Invasion", "The Haunting", "The Unborn", "Orphan", "Whiteout", "The Hills Have Eyes"];
            const searchPromises = darkTitles.map(title => 
                fetchWithRetry(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(title)}`)
                .then(data => data && data.results ? data.results[0] : null)
            );
            const results = await Promise.all(searchPromises);
            renderGrid(results.filter(m => m && m.poster_path));
        }

        async function fetchCultClassics() {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';
            const classicTitles = [
                "Halloween", "A Nightmare on Elm Street", "Friday the 13th", "Candyman", "Carrie", 
                "Final Destination", "Get Out", "Misery", "Scream", "The Texas Chain Saw Massacre", 
                "Child's Play", "The Exorcist", "The Shining", "The Thing", "Poltergeist", 
                "Hellraiser", "The Evil Dead", "Rosemary's Baby", "The Amityville Horror", 
                "The Omen", "Night of the Living Dead", "Saw", "The Ring", "The Blair Witch Project",
                "Psycho", "The Silence of the Lambs", "An American Werewolf in London", "Sleepaway Camp",
                "My Bloody Valentine", "The Descent", "28 Days Later", "The Cabin in the Woods",
                "Dawn of the Dead", "Day of the Dead", "Evil Dead II", "Army of Darkness",
                "Pet Sematary", "Christine", "The Fly", "Phantasm", "The Return of the Living Dead", 
                "Re-Animator", "Suspiria", "The Wicker Man"
            ];
            
            const searchPromises = classicTitles.map(title => 
                fetchWithRetry(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(title)}`)
                .then(data => data && data.results ? data.results[0] : null)
            );
            
            const results = await Promise.all(searchPromises);
            
            let unique = new Map();
            results.forEach(m => {
                if (m && m.poster_path && !unique.has(m.id)) {
                    unique.set(m.id, m);
                }
            });
            
            renderGrid(Array.from(unique.values()));
        }

        async function fetchExtremeMoviesInitial() {
            const extremeTitles = [
                { q: 'Terrifier' }, { q: 'Terrifier 2' }, { q: 'Terrifier 3' },
                { q: 'Seed' }, { q: 'I Spit on Your Grave' }, { q: 'I Spit on Your Grave 2' },
                { q: 'Inside', y: '2007' }, { q: 'Grotesque' }, { q: 'Martyrs', y: '2008' },
                { q: 'Rohtenburg' }, { q: 'Guinea Pig' }, { q: 'Cannibal Holocaust' },
                { q: 'The Green Inferno' }, { q: 'The Human Centipede' }, { q: 'The Human Centipede 2' },
                { q: 'Audition' }, { q: 'Tokyo Gore Police' }, { q: 'Frontier(s)' },
                { q: 'The Sadness' }, { q: 'Baskin' }, { q: 'Raw' }, { q: 'A Serbian Film' }, 
                { q: 'Salò, or the 120 Days of Sodom' }, { q: 'Nekromantik' }, { q: 'August Underground' },
                { q: 'Faces of Death' }
            ];
            let promises = extremeTitles.map(target =>
                fetchWithRetry(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(target.q)}${target.y ? '&primary_release_year='+target.y : ''}`)
                .then(data => data && data.results ? data.results.filter(item => item.genre_ids && item.genre_ids.includes(27))[0] : null)
            );
            const results = await Promise.all(promises);
            let movies = results.filter(m => m && m.poster_path);
            let unique = new Map();
            movies.forEach(m => { if (!unique.has(m.id)) { unique.set(m.id, m); loadedUnratedIds.add(m.id); } });
            return Array.from(unique.values()).map(m => ({ ...m, media_type: 'movie' }));
        }

        async function fetchExtremeMoviesMore(page) {
            const isMoviePage = page % 2 === 0;
            const pageTarget = Math.floor(page / 2);
            
            const excludedGenres = "16,35,18,10749,28,53"; 
            const extremeKeywords = "12377|33507|193386|230113|6152|14749|156322"; 

            let url = isMoviePage ? 
                `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&without_genres=${excludedGenres}&with_keywords=${extremeKeywords}&sort_by=popularity.desc&page=${pageTarget}` :
                `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=10765&without_genres=${excludedGenres}&with_keywords=${extremeKeywords}&sort_by=popularity.desc&page=${pageTarget}`;
            
            const data = await fetchWithRetry(url);
            let fetched = (data?.results || []).filter(item => 
                item.poster_path && 
                !loadedUnratedIds.has(item.id)
            ).map(item => ({ ...item, media_type: item.media_type || (item.first_air_date ? 'tv' : 'movie') }));
            
            let unique = new Map();
            fetched.forEach(item => { if (!unique.has(item.id)) { unique.set(item.id, item); loadedUnratedIds.add(item.id); } });
            return Array.from(unique.values());
        }

        function renderGrid(results) {
            const grid = document.getElementById('movie-grid');
            if (!results) return;
            results.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = "movie-card focusable fade-in"; card.tabIndex = 0;
                const type = m.media_type || (m.first_air_date ? 'tv' : 'movie');
                card.onclick = () => openDetails(m.id, type);
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover"><div class="movie-info horror-font"><h3 class="text-red-600 font-bold truncate">${m.title || m.name}</h3><p>${(m.release_date || m.first_air_date || '').split('-')[0]}</p></div>`;
                grid.appendChild(card);
            });
        }

        async function openDetails(id, type) {
            savedScrollPosition = window.scrollY || document.documentElement.scrollTop; 
            lastFocusedElement = document.activeElement; 

            const data = await fetchWithRetry(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`);
            if (!data) return;
            
            const isAnime = data.original_language === 'ja' && data.genres && data.genres.some(g => g.name === 'Animation');

            currentMedia = { id, type, s: 1, e: 1, title: data.name || data.title, poster: data.poster_path, isAnime };
            document.getElementById('show-title').innerText = currentMedia.title;
            document.getElementById('show-desc').innerText = data.overview || "";
            document.getElementById('show-year').innerText = (data.release_date || data.first_air_date || '').split('-')[0];
            document.getElementById('show-rating').innerText = data.vote_average ? data.vote_average.toFixed(1) : '★';
            document.getElementById('details-poster').src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
            document.getElementById('details-backdrop').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.backdrop_path})`;
            document.getElementById('media-type-tag').innerText = type.toUpperCase();
            
            const tvArea = document.getElementById('tv-controls');
            if (type === 'tv') { tvArea.classList.remove('hidden'); renderSeasons(data); } else { tvArea.classList.add('hidden'); }
            
            document.getElementById('main-app-wrapper').classList.add('hidden');
            document.getElementById('selector-overlay').classList.remove('hidden');
            window.scrollTo(0, 0);
            setTimeout(() => document.getElementById('main-play-trigger').focus(), 300);
        }

        function renderSeasons(data) {
            const container = document.getElementById('season-buttons'); container.innerHTML = '';
            if(!data.seasons) return;
            data.seasons.forEach(s => {
                if (s.season_number === 0) return;
                const btn = document.createElement('button');
                btn.className = "focusable px-6 py-2 bg-zinc-900 rounded horror-font text-lg border border-zinc-800 whitespace-nowrap";
                btn.innerText = `Season ${s.season_number}`;
                btn.onclick = () => loadEpisodes(data.id, s.season_number);
                container.appendChild(btn);
            });
            if(container.firstChild) container.firstChild.click();
        }

        async function loadEpisodes(showId, seasonNum) {
            const data = await fetchWithRetry(`https://api.themoviedb.org/3/tv/${showId}/season/${seasonNum}?api_key=${API_KEY}`);
            if(!data) return;
            const grid = document.getElementById('episode-grid'); grid.innerHTML = '';
            data.episodes.forEach(e => {
                const epRow = document.createElement('div');
                epRow.className = "episode-row focusable"; epRow.tabIndex = 0;
                epRow.onclick = () => { currentMedia.s = seasonNum; currentMedia.e = e.episode_number; startLuxeStream(); };
                const thumb = e.still_path ? `https://image.tmdb.org/t/p/w300${e.still_path}` : '';
                epRow.innerHTML = `<div class="ep-thumbnail" style="background-image:url(${thumb})"><div class="ep-play-icon">▶</div></div><div class="flex-1"><div class="text-white font-bold">E${e.episode_number} ${e.name}</div><div class="text-zinc-500 text-xs line-clamp-1">${e.overview}</div></div>`;
                grid.appendChild(epRow);
            });
        }

        async function startLuxeStream() {
            const { type, id, s, e, isAnime, title } = currentMedia;
            const playerOverlay = document.getElementById('player-overlay');
            const iframe = document.getElementById('luxe-player');
            playerOverlay.style.display = 'block';
            
            const vidsrcUrl = (type === 'movie' ? `https://vidsrc.pm/embed/movie/${id}` : `https://vidsrc.pm/embed/tv/${id}/${s}/${e}`);
            const consumetUrl = `https://consumet-api-fawn.vercel.app/anime/gogoanime/watch/${encodeURIComponent(title.toLowerCase().replace(/ /g, '-'))}-episode-${e}`;

            iframe.src = "about:blank"; 
            if (isAnime) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 1200); 
                    const response = await fetch(consumetUrl, { method: 'HEAD', signal: controller.signal });
                    clearTimeout(timeoutId);
                    iframe.src = response.ok ? consumetUrl : vidsrcUrl;
                } catch (err) { iframe.src = vidsrcUrl; }
            } else { iframe.src = vidsrcUrl; }

            setTimeout(() => { if(document.getElementById('close-player-btn')) document.getElementById('close-player-btn').focus(); }, 400);
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
        
        function closeSelector() { 
            document.getElementById('selector-overlay').classList.add('hidden'); 
            document.getElementById('main-app-wrapper').classList.remove('hidden'); 
            window.scrollTo(0, savedScrollPosition); 
            if (lastFocusedElement) {
                lastFocusedElement.focus();
            } else {
                document.getElementById('btn-trending').focus(); 
            }
        }
        
        function closePlayer() { 
            document.getElementById('luxe-player').src = "about:blank"; 
            document.getElementById('player-overlay').style.display = 'none'; 
            document.getElementById('main-play-trigger').focus();
        }
        
        function setFilter(type, id = '') {
            activeType = type; activeID = id;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            if(event && event.target && event.target.tagName === 'BUTTON') event.target.classList.add('nav-active');
            fetchContent();
            document.getElementById('side-menu').classList.remove('menu-open');
            window.scrollTo(0,0);
        }

        function triggerSearch() {
            const input = document.getElementById('search-input');
            const query = input.value.trim();
            if(query) {
                setFilter('search', query);
                input.blur();
                setTimeout(() => {
                    const firstResult = document.querySelector('#movie-grid .focusable');
                    if(firstResult) firstResult.focus();
                }, 800);
            } else {
                input.blur();
                setFilter('trending_theaters');
                document.getElementById('btn-trending').classList.add('nav-active');
            }
        }

        function handleSearch(e) { if (e.key === 'Enter') triggerSearch(); }

        document.addEventListener('keydown', function(e) {
            const current = document.activeElement;
            const focusables = Array.from(document.querySelectorAll('.focusable')).filter(el => el.offsetParent !== null);
            
            if (e.key === 'Backspace' || e.keyCode === 8 || e.keyCode === 10009) {
                if (current && current.id === 'search-input') return; 
                e.preventDefault();
                if (document.getElementById('player-overlay').style.display === 'block') closePlayer();
                else if (!document.getElementById('selector-overlay').classList.contains('hidden')) closeSelector();
                else if (document.getElementById('side-menu').classList.contains('menu-open')) toggleMenu();
                return;
            }

            if (e.key === 'Enter' || e.keyCode === 13) { 
                if (current && current.id === 'search-input') { triggerSearch(); return; }
                if (current && current.classList.contains('focusable')) { current.click(); return; }
            }

            let dir = '';
            if (e.key === 'ArrowUp') dir = 'up'; if (e.key === 'ArrowDown') dir = 'down'; if (e.key === 'ArrowLeft') dir = 'left'; if (e.key === 'ArrowRight') dir = 'right';
            if (dir) {
                e.preventDefault();
                const next = findNext(current, focusables, dir);
                if (next) { next.focus(); next.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            }
        });

        function findNext(cur, targets, dir) {
            if (!cur || cur === document.body) return targets[0];
            const r1 = cur.getBoundingClientRect(), c1 = { x: r1.left + r1.width/2, y: r1.top + r1.height/2 };
            let best = null, min = Infinity;
            targets.forEach(t => {
                if (t === cur) return;
                const r2 = t.getBoundingClientRect(), c2 = { x: r2.left + r2.width/2, y: r2.top + r2.height/2 };
                if (dir === 'up' && c2.y >= c1.y) return; if (dir === 'down' && c2.y <= c1.y) return;
                if (dir === 'left' && c2.x >= c1.x) return; if (dir === 'right' && c2.x <= c1.x) return;
                const d = Math.sqrt(Math.pow(c2.x - c1.x, 2) + Math.pow(c2.y - c1.y, 2));
                if (d < min) { min = d; best = t; }
            });
            return best;
        }

        window.onload = () => {
            fetchContent();
            setTimeout(() => { 
                const loader = document.getElementById('loader');
                if(loader) { loader.style.opacity = '0'; setTimeout(()=>loader.remove(), 800); }
            }, 1200);
            const obs = new IntersectionObserver(e => { if(e[0].isIntersecting && activeType !== 'after_dark') fetchContent(true); });
            obs.observe(document.getElementById('sentinel'));
        };
    </script>
