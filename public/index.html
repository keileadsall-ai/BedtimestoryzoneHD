        #side-menu { position: fixed; top: 0; left: 0; bottom: 0; width: 300px; background: #000; border-right: 3px solid var(--blood); z-index: 4000; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        .nav-active { border-bottom: 2px solid var(--blood); color: var(--blood) !important; }
        .movie-card { aspect-ratio: 2/3; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 2px solid transparent; background: #0a0a0a; position: relative; }

        #player-overlay {

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .player-header {
            position: absolute; top: 25px; left: 25px; right: 25px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 9001;
        }
        .player-title {
            font-family: 'Metal Mania', cursive; color: var(--blood);

        async function fetchTMDBFromIMDb(imdbId) {
            if (imdbCache.has(imdbId)) return imdbCache.get(imdbId);
            try {
                const res = await fetch(`https://api.themoviedb.org/3/find/${imdbId}?api_key=${API_KEY}&external_source=imdb_id`);
                const data = await res.json();
                if (data.movie_results && data.movie_results.length > 0) {
                    const result = { id: data.movie_results[0].id, type: 'movie' };
                    imdbCache.set(imdbId, result);
                    return result;
                } else if (data.tv_results && data.tv_results.length > 0) {
                    const result = { id: data.tv_results[0].id, type: 'tv' };
                    imdbCache.set(imdbId, result);
                    return result;
                }
            } catch (e) {}
            return null;
        }

                        }

                }
                return null;
            });
            const items = await Promise.all(promises);
            return items.filter(Boolean);

        async function fetchContent(append = false) {
            if (isLoading) return;
            isLoading = true;
            const grid = document.getElementById('movie-grid');
            const blackSection = document.getElementById('black-horror-section');
            if (!append) { 
                currentPage = 1; 
                grid.innerHTML = ''; 
                blackSection.innerHTML = ''; 
                loadedBlackHorrorIds.clear();
                blackHorrorPage = 1;
                loadedUnratedIds.clear();
                loadedHorrorShowIds.clear();
                loadedYouthHorrorIds.clear();
                youthHorrorPage = 1;
                loadedAbroadIds.clear();
                abroadPage = 1;
                loadedLatestBloodIds.clear();
                latestBloodPage = 1;
                loadedHorrorMoviesIds.clear();
                horrorMoviesPage = 1;
            }

            let results = [];
            if (activeType === 'trending') {
                const url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&without_genres=16,10751,35&primary_release_date.gte=2024-01-01&sort_by=popularity.desc&page=${latestBloodPage}`;
                const res = await fetch(url);
                const data = await res.json();
                let movies = (data.results || []).filter(m => m.poster_path && !loadedLatestBloodIds.has(m.id));
                movies.forEach(m => loadedLatestBloodIds.add(m.id));
                results = movies.map(m => ({ ...m, media_type: 'movie' }));
                latestBloodPage++;
            } else if (activeType === 'abroad') {
                const fetchPromises = abroadSpecs.map(spec => {
                    let url = `https://api.themoviedb.org/3/discover/${spec.type}?api_key=${API_KEY}&with_genres=${spec.genre}&sort_by=${spec.sort}&page=${abroadPage}`;
                    if (spec.country) url += `&with_origin_country=${spec.country}`;
                    if (spec.keywords) url += `&with_keywords=${spec.keywords}`;
                    return fetch(url).then(r => r.json()).then(data => {
                        return (data.results || []).map(item => ({ ...item, media_type: spec.type, _priority: spec.priority }));
                    });
                });
                const resultsArrays = await Promise.all(fetchPromises);
                let aggregated = [].concat(...resultsArrays);
                let unique = new Map();
                aggregated.forEach(item => {
                    if (item.poster_path && !loadedAbroadIds.has(item.id)) {
                        loadedAbroadIds.add(item.id);
                        unique.set(item.id, item);
                    }
                });
                results = Array.from(unique.values());
                results.sort((a, b) => (a._priority - b._priority) || (b.popularity - a.popularity));
                abroadPage++;
            } else if (activeType === 'black_horror') {
                if (!append) {
                    const hardwiredItems = await resolveItemsFromImdbList(HARD_WIRED_IMDB_IDS, loadedBlackHorrorIds);
                    renderBlackHorror(hardwiredItems, false);
                    isLoading = false;
                    return;
                } else {
                    const actorIdsParam = UNIQUE_BLACK_IDS.join('|');
                    const urls = [
                        `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&with_people=${actorIdsParam}&sort_by=popularity.desc&page=${blackHorrorPage}`
                    ];
                    const responses = await Promise.all(urls.map(url => fetch(url).then(r => r.json())));
                    let items = [];
                    responses[0].results && responses[0].results.forEach(m => { if (m.poster_path && !loadedBlackHorrorIds.has(m.id)) items.push({...m, media_type:'movie'}); });
                    let unique = new Map();
                    items.forEach(item => { if (!unique.has(item.id)) { unique.set(item.id, item); loadedBlackHorrorIds.add(item.id); } });
                    renderBlackHorror(Array.from(unique.values()), true);
                    blackHorrorPage++;
                    isLoading = false;
                    return;
                }
            } else if (activeType === 'youth') {
                if (!append) {
                    loadedYouthHorrorIds.clear();
                    youthHorrorPage = 1;
                    const hardwiredItems = await resolveItemsFromImdbList([...new Set(YOUTH_IMDB_IDS)], loadedYouthHorrorIds);
                    let unique = new Map();
                    hardwiredItems.forEach(item => unique.set(item.id, item));
                    results = Array.from(unique.values());
                    currentPage = 2;
                } else {
                    const isMoviePage = currentPage % 2 === 0;
                    const pageTarget = Math.floor(currentPage / 2) + 1;
                    let targetUrl = isMoviePage ? 
                        `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&certification_country=US&certification.lte=PG-13&with_keywords=${YOUTH_KEYWORDS}&sort_by=popularity.desc&page=${pageTarget}` :
                        `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=10765&certification_country=US&certification.lte=TV-14&with_keywords=${YOUTH_KEYWORDS}&sort_by=popularity.desc&page=${pageTarget}`;
                    const res = await fetch(targetUrl);
                    const data = await res.json();
                    let fetched = (data.results || []).filter(item => item.poster_path && !loadedYouthHorrorIds.has(item.id)).map(item => ({ ...item, media_type: item.media_type || (item.first_air_date ? 'tv' : 'movie') }));
                    let unique = new Map();
                    fetched.forEach(item => { if (!unique.has(item.id)) { unique.set(item.id, item); loadedYouthHorrorIds.add(item.id); } });
                    results = Array.from(unique.values());
                    currentPage++;
                }
            } else if (activeType === 'horror_movies') {
                if (!append) {
                    loadedHorrorMoviesIds.clear();
                    horrorMoviesPage = 1;
                    currentPage = 1;
                }
                const url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&with_keywords=${HORROR_FILMS_KEYWORDS}&sort_by=popularity.desc&page=${horrorMoviesPage}`;
                const res = await fetch(url);
                const data = await res.json();
                let fetched = (data.results || []).filter(m => m.poster_path && !loadedHorrorMoviesIds.has(m.id)).map(m => ({ ...m, media_type: 'movie' }));
                let unique = new Map();
                fetched.forEach(m => { if (!unique.has(m.id)) { unique.set(m.id, m); loadedHorrorMoviesIds.add(m.id); } });
                results = Array.from(unique.values()).map(m => ({ ...m, media_type: 'movie' }));
                horrorMoviesPage++;
            } else if (activeType === 'stephen_king') {
                if (append) { isLoading = false; return; }
                const fetched = await resolveItemsFromImdbList(STEPHEN_KING_IMDB_IDS, new Set());
                renderGrid(fetched);
                isLoading = false;
                return;
            } else if (activeType === 'wes_craven') {
                if (append) { isLoading = false; return; }
                const fetched = await resolveItemsFromImdbList(WES_CRAVEN_IMDB_IDS, new Set());
                renderGrid(fetched);
                isLoading = false;
                return;
            } else if (activeType === 'horror_fest') {
                if (append) { isLoading = false; return; }
                const fetched = await resolveItemsFromImdbList(HORROR_FEST_IMDB_IDS, new Set());
                renderGrid(fetched);
                isLoading = false;
                return;
            } else if (activeType === 'horror_shows') {
                if (!append) {
                    loadedHorrorShowIds.clear();
                    horrorShowPageEn = 1;
                    currentPage = 1;
                }
                const horrorKeywords = '33507|6152|9653|193386|230113';
                const url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=10765&with_keywords=${horrorKeywords}&sort_by=popularity.desc&page=${horrorShowPageEn}`;
                const res = await fetch(url);
                const data = await res.json();
                let combined = [];
                if (data.results) {
                    combined = combined.concat(data.results.filter(item => item.poster_path && item.genre_ids && item.genre_ids.includes(10765) && !loadedHorrorShowIds.has(item.id)));
                }
                let uniqueMap = new Map();
                combined.forEach(item => {
                    if (!uniqueMap.has(item.id)) {
                        uniqueMap.set(item.id, item);
                        loadedHorrorShowIds.add(item.id);
                    }
                });
                results = Array.from(uniqueMap.values()).map(t => ({ ...t, media_type: 'tv' }));
                horrorShowPageEn++;
            } else if (activeType === 'unrated') {
                const extremeKeywords = '12341|6152|33507|193386|230113|15284|10349|14638|1551|9679|9748|10244|11181|10123|10220|10322|20711';
                const url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&certification_country=US&certification=NR|UR|NC-17&with_keywords=${extremeKeywords}&sort_by=popularity.desc&page=${currentPage}`;
                const res = await fetch(url);
                const data = await res.json();
                let movies = (data.results || []).filter(m => m.poster_path && m.genre_ids && m.genre_ids.includes(27) && !loadedUnratedIds.has(m.id));
                let unique = new Map();
                movies.forEach(m => { if (!unique.has(m.id)) { unique.set(m.id, m); loadedUnratedIds.add(m.id); } });
                results = Array.from(unique.values()).map(m => ({ ...m, media_type: 'movie' }));
                currentPage++;
            } else {
                let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&page=${currentPage}`;
                if (activeType === 'search') url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${activeID}&page=${currentPage}`;
                const res = await fetch(url);
                const data = await res.json();
                results = data.results;
            }
            renderGrid(results);
            if (!['horror_shows','youth','unrated','abroad','trending','horror_movies','stephen_king','wes_craven','horror_fest'].includes(activeType)) currentPage++;
            isLoading = false;
        }

        function renderBlackHorror(items, append) {
            const container = document.getElementById('black-horror-section');
            if (!append) container.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'movie-card focusable'; card.tabIndex = 0;
                card.onclick = () => openDetails(item.id, item.media_type || (item.first_air_date ? 'tv' : 'movie'));
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${item.poster_path}" class="w-full h-full object-cover"><div class="movie-info horror-font"><h3 class="text-red-600 font-bold truncate">${item.title || item.name}</h3><p>${(item.release_date || item.first_air_date || '').split('-')[0]}</p></div>`;
                container.appendChild(card);
            });
        }

        function renderGrid(results) {
            const grid = document.getElementById('movie-grid');
            if (!results) return;
            results.forEach(m => {
                const card = document.createElement('div');
                card.className = "movie-card focusable"; card.tabIndex = 0;
                if (!m.poster_path) return;
                const type = m.media_type || (m.first_air_date ? 'tv' : 'movie');
                card.onclick = () => openDetails(m.id, type);
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover">`;
                grid.appendChild(card);
            });
        }

        async function openDetails(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`);
            const data = await res.json();
            currentMedia = { id, type, s: 1, e: 1, title: data.name || data.title, poster: data.poster_path };
            document.getElementById('show-title').innerText = currentMedia.title;
            document.getElementById('show-desc').innerText = data.overview || "";
            document.getElementById('show-year').innerText = (data.release_date || data.first_air_date || '').split('-')[0];
            document.getElementById('show-rating').innerText = data.vote_average ? data.vote_average.toFixed(1) : '★';
            document.getElementById('details-poster').src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
            document.getElementById('details-backdrop').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.backdrop_path})`;
            document.getElementById('media-type-tag').innerText = type.toUpperCase();
            const tvArea = document.getElementById('tv-controls');
            if (type === 'tv') { tvArea.classList.remove('hidden'); renderSeasons(data); } else { tvArea.classList.add('hidden'); }
            document.getElementById('main-app-wrapper').classList.add('hidden');
            document.getElementById('selector-overlay').classList.remove('hidden');
            window.scrollTo(0, 0);
            setTimeout(() => document.getElementById('main-play-trigger').focus(), 300);
        }

        function renderSeasons(data) {
            const container = document.getElementById('season-buttons'); container.innerHTML = '';
            if(!data.seasons) return;
            data.seasons.forEach(s => {
                if (s.season_number === 0) return;
                const btn = document.createElement('button');
                btn.className = "focusable px-6 py-2 bg-zinc-900 rounded horror-font text-lg border border-zinc-800 whitespace-nowrap";
                btn.innerText = `Season ${s.season_number}`;
                btn.onclick = () => loadEpisodes(data.id, s.season_number);
                container.appendChild(btn);
            });
            if(container.firstChild) container.firstChild.click();
        }

        async function loadEpisodes(showId, seasonNum) {
            const res = await fetch(`https://api.themoviedb.org/3/tv/${showId}/season/${seasonNum}?api_key=${API_KEY}`);
            const data = await res.json();
            const grid = document.getElementById('episode-grid'); grid.innerHTML = '';
            data.episodes.forEach(e => {
                const epRow = document.createElement('div');
                epRow.className = "episode-row focusable"; epRow.tabIndex = 0;
                epRow.onclick = () => { currentMedia.s = seasonNum; currentMedia.e = e.episode_number; startLuxeStream(); };
                const thumb = e.still_path ? `https://image.tmdb.org/t/p/w300${e.still_path}` : '';
                epRow.innerHTML = `<div class="ep-thumbnail" style="background-image:url(${thumb})"><div class="ep-play-icon">▶</div></div><div class="flex-1"><div class="text-white font-bold">E${e.episode_number} ${e.name}</div><div class="text-zinc-500 text-xs line-clamp-1">${e.overview}</div></div>`;
                grid.appendChild(epRow);
            });
        }

        function startLuxeStream() {
            const { type, id, s, e } = currentMedia;
            const playerOverlay = document.getElementById('player-overlay');
            const iframe = document.getElementById('luxe-player');
            playerOverlay.style.display = 'block';
            
            // Hardcoded parameters bypass standard tracking constraints, enforcing native fullscreen initialization and audio handshakes
            iframe.src = (type === 'movie'
                ? `https://vidlink.pro/movie/${id}?primaryColor=e50914&autoplay=true&muted=false`
                : `https://vidlink.pro/tv/${id}/${s}/${e}?primaryColor=e50914&autoplay=true&muted=false`);
                
            setTimeout(() => document.getElementById('close-player-btn').focus(), 500);
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
        function closeSelector() { document.getElementById('selector-overlay').classList.add('hidden'); document.getElementById('main-app-wrapper').classList.remove('hidden'); }
        function closePlayer() { document.getElementById('luxe-player').src = ""; document.getElementById('player-overlay').style.display = 'none'; }
        
        function setFilter(type, id = '') {
            activeType = type; activeID = id;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            if(window.event && window.event.target.tagName === 'BUTTON') window.event.target.classList.add('nav-active');
            fetchContent();
            document.getElementById('side-menu').classList.remove('menu-open');
            window.scrollTo(0,0);
        }

        function handleSearch(e) { if (e.key === 'Enter') { activeType = 'search'; activeID = e.target.value; fetchContent(); e.target.blur(); } }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace') {
                if (document.getElementById('player-overlay').style.display === 'block') closePlayer();
                else if (!document.getElementById('selector-overlay').classList.contains('hidden')) closeSelector();
            }
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const dir = e.key.replace('Arrow', '').toLowerCase();
                const next = findNext(document.activeElement, Array.from(document.querySelectorAll('.focusable')).filter(el => el.offsetParent !== null), dir);
                if (next) { next.focus(); next.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            }
        });

        function findNext(cur, targets, dir) {
            if (!cur || cur === document.body) return targets[0];
            const r1 = cur.getBoundingClientRect(), c1 = { x: r1.left + r1.width/2, y: r1.top + r1.height/2 };
            let best = null, min = Infinity;
            targets.forEach(t => {
                if (t === cur) return;
                const r2 = t.getBoundingClientRect(), c2 = { x: r2.left + r2.width/2, y: r2.top + r2.height/2 };
                if (dir === 'up' && c2.y >= c1.y) return; if (dir === 'down' && c2.y <= c1.y) return;
                if (dir === 'left' && c2.x >= c1.x) return; if (dir === 'right' && c2.x <= c1.x) return;
                const d = Math.sqrt(Math.pow(c2.x - c1.x, 2) + Math.pow(c2.y - c1.y, 2));
                if (d < min) { min = d; best = t; }
            });
            return best;
        }

        window.onload = () => {
            fetchContent();
            setTimeout(() => { 
                const loader = document.getElementById('loader');
                if(loader) { loader.style.opacity = '0'; setTimeout(()=>loader.remove(), 800); }
            }, 1200);
            const obs = new IntersectionObserver(e => { if(e[0].isIntersecting && activeType !== 'after_dark') fetchContent(true); });
            obs.observe(document.getElementById('sentinel'));
        };
    </script>
