<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fear+ | The Final Ritual</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Metal+Mania&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --blood: #e50914; --void: #000; --ash: #1a1a1a; }
        body { background: var(--void); color: white; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; touch-action: pan-y; }
        .horror-font { font-family: 'Creepster', cursive; }
        .nosifer { font-family: 'Nosifer', cursive; }
        #loader { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s; }
        .voodoo-container { width: 180px; height: 180px; border-radius: 50%; border: 3px solid var(--blood); overflow: hidden; box-shadow: 0 0 40px var(--blood); }
        .medusa-heart { width: 100%; height: 100%; object-fit: cover; animation: thump 1s infinite; }
        @keyframes thump { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } }
        #side-menu { position: fixed; top: 0; left: 0; bottom: 0; width: 300px; background: #000; border-right: 3px solid var(--blood); z-index: 4000; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .menu-open { transform: translateX(0) !important; box-shadow: 20px 0 60px #000; }
        .nav-active { border-bottom: 2px solid var(--blood); color: var(--blood) !important; }
        .movie-card { aspect-ratio: 2/3; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 2px solid transparent; background: #0a0a0a; position: relative; }
        .focusable:focus { outline: none; border-color: #fff !important; transform: scale(1.08); box-shadow: 0 0 25px rgba(229, 9, 20, 0.8); z-index: 50; }
        header { height: 45vh; background: linear-gradient(to bottom, transparent, var(--void)), url('IMG_8238.jpeg') no-repeat center top; background-size: cover; display: flex; align-items: flex-end; padding: 40px; }
        .btn-play-blood { background: var(--blood); color: white; font-weight: 700; padding: 14px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 400px; }
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .episode-row { display: flex; gap: 15px; padding: 12px; border-bottom: 1px solid #111; cursor: pointer; border: 2px solid transparent; border-radius: 8px; }
        .ep-thumbnail { width: 120px; aspect-ratio: 16/9; background-size: cover; border-radius: 4px; flex-shrink: 0; background-color: #111; position: relative; }
        .ep-play-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); color: white; font-size: 1.2rem; }
        .movie-info { position: absolute; bottom: 0; background: rgba(0,0,0,0.85); width: 100%; padding: 8px; font-size: 0.75rem; opacity: 0; transition: 0.3s; }
        .movie-card:hover .movie-info { opacity: 1; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="voodoo-container"><img src="IMG_8259.jpeg" class="medusa-heart"></div>
        <h2 class="nosifer text-red-600 mt-6 text-xl">Entering the Ritual...</h2>
    </div>

    <div id="side-menu" class="p-8 no-scrollbar overflow-y-auto">
        <h2 class="nosifer text-red-600 text-2xl mb-8">THE VAULTS</h2>
        <div class="flex flex-col gap-2 horror-font text-xl">
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('stephen_king')">STEPHEN KING</button>
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('wes_craven')">WES CRAVEN</button>
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('after_dark')">DARK CASTLE</button>
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('black_horror')">BLACK HORROR</button>
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('youth')">YOUTH HORROR</button>
            <button class="focusable text-left py-3 border-b border-zinc-900" onclick="setFilter('abroad')">HORROR FROM ABROAD</button>
            <button class="focusable text-left py-3 mt-10 text-zinc-600" onclick="toggleMenu()">CLOSE [X]</button>
        </div>
    </div>

    <div id="main-app-wrapper">
        <header><h1 class="nosifer text-red-600 text-6xl md:text-8xl">FEAR+</h1></header>

        <div class="sticky top-0 z-[1000] bg-black/95 border-b border-zinc-900">
            <div class="flex items-center w-[95%] mx-auto gap-4 py-4">
                <button id="menu-btn" onclick="toggleMenu()" class="focusable text-red-600 text-3xl px-2">☰</button>
                <input type="search" id="search-input" class="focusable flex-1 bg-zinc-900 border border-zinc-800 rounded-lg py-3 px-6 text-white horror-font text-lg outline-none" placeholder="Search the Graves..." onkeyup="handleSearch(event)">
            </div>
            <nav class="flex px-6 pb-2 gap-8 overflow-x-auto no-scrollbar horror-font text-lg tracking-widest uppercase">
                <button id="btn-trending" onclick="setFilter('trending')" class="focusable nav-active whitespace-nowrap">LATEST BLOOD</button>
                <button class="focusable whitespace-nowrap" onclick="setFilter('horror_movies')">HORROR FILMS</button>
                <button class="focusable whitespace-nowrap" onclick="setFilter('horror_shows')">GHASTLY SERIES</button>
                <button class="focusable whitespace-nowrap" onclick="setFilter('unrated')">UNRATED</button>
            </nav>
        </div>

        <main id="black-horror-section" class="p-6 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></main>
        <main id="movie-grid" class="p-6 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></main>
        <div id="sentinel" class="h-20"></div>
    </div>

    <div id="selector-overlay" class="hidden fixed inset-0 bg-black z-[5000] overflow-y-auto no-scrollbar">
        <div id="details-backdrop" class="absolute top-0 w-full h-[60vh] opacity-40 bg-cover bg-center filter blur-2xl"></div>
        <div class="relative z-10 p-6 max-w-5xl mx-auto">
            <button onclick="closeSelector()" class="focusable mb-8 bg-white/10 p-3 rounded-full border border-white/20">
                <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div class="flex flex-col md:row gap-8 mb-10">
                <img id="details-poster" class="w-48 rounded-xl shadow-2xl border border-red-900/30">
                <div class="flex flex-col justify-end">
                    <h2 id="show-title" class="nosifer text-3xl md:text-5xl text-white mb-4 leading-tight"></h2>
                    <div class="flex items-center gap-4 horror-font text-xl text-zinc-400">
                        <span id="show-year"></span>
                        <span class="border border-red-600 text-red-600 px-2 py-1 rounded">★ <span id="show-rating"></span></span>
                        <span id="media-type-tag" class="text-zinc-500"></span>
                    </div>
                    <button id="main-play-trigger" onclick="startLuxeStream()" class="focusable btn-play-blood mt-6 horror-font text-2xl tracking-widest">▶ COMMENCE</button>
                </div>
            </div>
            <p id="show-desc" class="text-zinc-400 text-lg leading-relaxed mb-10 max-w-3xl"></p>
            <div id="tv-controls" class="hidden">
                <h3 class="horror-font text-red-600 text-2xl mb-4 uppercase">Epitaphs</h3>
                <div id="season-buttons" class="flex gap-3 overflow-x-auto no-scrollbar mb-6"></div>
                <div id="episode-grid" class="flex flex-col gap-2"></div>
            </div>
        </div>
    </div>

    <div id="player-overlay">
        <div class="absolute top-6 left-6 right-6 flex justify-between items-center z-[9001]">
            <div class="horror-font text-red-600 bg-black/80 px-4 py-2 rounded border border-red-900 uppercase">Now Consuming</div>
            <button id="close-player-btn" onclick="closePlayer()" class="focusable bg-red-600 text-white px-6 py-2 rounded font-bold">✕ CEASE</button>
        </div>
        <iframe id="luxe-player" class="w-full h-full" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <script>
        const API_KEY = 'b9c746781e1e9b084c4cc4f0420156d4';
        const HORROR_ID = 27;
        let activeType = 'trending', activeID = '', currentMedia = {};
        let currentPage = 1, isLoading = false;

        async function fetchContent(append = false) {
            if (isLoading) return;
            isLoading = true;
            const grid = document.getElementById('movie-grid');
            const blackSection = document.getElementById('black-horror-section');
            if (!append) { currentPage = 1; grid.innerHTML = ''; blackSection.innerHTML = ''; }

            let results = [];
            if (activeType === 'black_horror') {
                await fetchBlackHorrorComprehensive();
                isLoading = false; return;
            } else if (activeType === 'stephen_king') {
                await fetchStephenKing();
                isLoading = false; return;
            } else if (activeType === 'after_dark') {
                await fetchAfterDark();
                isLoading = false; return;
            } else if (activeType === 'wes_craven') {
                const url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_crew=5140&sort_by=release_date.desc&page=${currentPage}`;
                const res = await fetch(url);
                const data = await res.json();
                results = data.results;
            } else if (activeType === 'horror_shows') {
                // TV Shows do not use genre ID 27 on TMDB. We pool 10765 (Sci-Fi/Fantasy/Supernatural) and 9648 (Mystery/Thrillers)
                if (!append) {
                    let totalPagesToFetch = 4; 
                    let promises = [];
                    for (let p = 1; p <= totalPagesToFetch; p++) {
                        promises.push(
                            fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=10765|9648&page=${p}`)
                            .then(res => res.json())
                            .then(data => data.results || [])
                            .catch(() => [])
                        );
                    }
                    const arrays = await Promise.all(promises);
                    results = [].concat(...arrays);
                    currentPage = totalPagesToFetch + 1;
                } else {
                    const url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=10765|9648&page=${currentPage}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    results = data.results;
                    currentPage++;
                }
            } else if (activeType === 'unrated') {
                const url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&certification_country=US&certification=NR|UR|NC-17&page=${currentPage}`;
                const res = await fetch(url);
                const data = await res.json();
                results = data.results;
            } else {
                let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&page=${currentPage}`;
                if (activeType === 'trending') url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&page=${currentPage}`;
                else if (activeType === 'youth') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&certification_country=US&certification.lte=PG-13&page=${currentPage}`;
                else if (activeType === 'abroad') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${HORROR_ID}&without_original_language=en&page=${currentPage}`;
                else if (activeType === 'search') url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${activeID}&page=${currentPage}`;
                const res = await fetch(url);
                const data = await res.json();
                results = data.results;
            }
            renderGrid(results);
            if (activeType !== 'horror_shows') currentPage++;
            isLoading = false;
        }

        async function fetchAfterDark() {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';
            
            const darkTitles = [
                "House on Haunted Hill", "Thir13en Ghosts", "Ghost Ship", "Gothika", "House of Wax", "The Reaping", "The Invasion", "The Haunting", "The Unborn", "Orphan", "Whiteout", "The Hills Have Eyes", "The Hills Have Eyes 2", "The Last House on the Left", "The Crazies", "The Collector", "The Collection", "The Quiet Ones", "The Boy", "The Belko Experiment", "The Bye Bye Man", "The Nun", "The Curse of La Llorona", "The Prodigy", "The Turning", "The Wretched",
                "The Abandoned", "The Deaths of Ian Stone", "Lake Dead", "Unrest", "Penny Dreadful", "Darkness Falls", "The Gravedancers", "The Hamiltons", "Reincarnation", "Wicked Little Things", "Autopsy", "Borderland", "Crazy Eights", "Frontier(s)", "The Final", "The Broken", "Dread", "From Within", "Kill Theory", "The Graves", "The Reeds", "The Task", "Sick Girl", "Freakshow", "Butchered", "The Other Side of the Tracks", "Headgame", "Husk", "The Terror", "The Tortured",
                "Captivity", "Offspring", "The Uninvited", "Slaughter", "The Dread", "The Covenant"
            ];

            const searchPromises = darkTitles.map(title => 
                fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(title)}`)
                .then(r => r.json())
                .then(data => data.results ? data.results[0] : null)
            );

            const results = await Promise.all(searchPromises);
            renderGrid(results.filter(m => m && m.poster_path));
        }

        async function fetchStephenKing() {
            const res = await fetch(`https://api.themoviedb.org/3/person/3027/combined_credits?api_key=${API_KEY}`);
            const data = await res.json();
            let pool = [...data.cast, ...data.crew].filter(m => m.poster_path && (m.job === 'Writer' || m.job === 'Novel' || m.job === 'Author') && !m.genre_ids.includes(99));
            const seen = new Set();
            const unique = pool.filter(item => seen.has(item.id) ? false : seen.add(item.id)).sort((a, b) => b.popularity - a.popularity);
            renderGrid(unique);
        }

        async function fetchBlackHorrorComprehensive() {
            const BLACK_HORROR_FILM_IDS = [458156, 568489, 508947, 337401, 619264, 603692, 718989, 581392, 458723, 587807, 496450, 736726, 605116, 533535, 438631, 569094, 506574, 97404, 75780, 9372, 102387, 385103, 761703, 632357, 529203, 475557, 506054, 539885, 414906, 284404, 590864];
            let pool = [];
            const kwRes = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&with_keywords=233306|209825`);
            const kwData = await kwRes.json();
            pool.push(...kwData.results);
            for (let id of BLACK_HORROR_FILM_IDS) {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}`);
                if (res.ok) pool.push(await res.json());
            }
            const BLACK_HORROR_TITLES = ["Get Out", "Us", "Nope", "Candyman", "Blacula", "Scream Blacula Scream", "Def by Temptation", "Eve's Bayou", "Tales from the Hood", "Ganja & Hess", "The People Under the Stairs", "Vampires vs. the Bronx", "Lovecraft Country", "Them", "The Blood of Jesus", "Son of Ingagi", "Spell", "Antebellum", "His House", "Black Box", "Da Sweet Blood of Jesus", "Demon Knight", "Vampire in Brooklyn", "Abby", "Blackenstein", "Slaughter", "The Spook Who Sat by the Door", "The House on Skull Mountain", "J.D.'s Revenge", "Sugar Hill", "The Serpent and the Rainbow", "Voodoo Dawn", "Night of the Living Dead", "The Blackening", "The Invitation", "The House", "The Last House on the Left", "The Purge", "The Ritual", "The Skeleton Key", "The Covenant", "Fallen", "Bad Hair", "Bleeding Rose", "Urban Cannibal Massacre", "The Other Black Girl", "Swarm", "Horror Noire", "Attack the Block", "The Girl with All the Gifts", "Master", "Diary of a Mad Black Woman", "Hood of Horror", "The Evil One", "Frankenfish", "Beloved", "House on Haunted Hill", "Constantine", "Gothika", "The Deliverance", "Nanny", "They Cloned Tyrone", "Soft & Quiet", "Talk to Me", "Blade", "Blade II", "Blade: Trinity", "Queen of the Damned", "Spawn", "The Reading", "Ma", "Scary Movie", "Scary Movie 2", "Scary Movie 3", "A Haunted House", "A Haunted House 2", "Meet the Blacks", "Meet the Blacks 2: The House Next Door", "Fear of a Black Hat", "Boo! A Madea Halloween", "Boo 2! A Madea Halloween", "Da Sweet Blood of Jesus", "The Transfiguration", "Tales from the Hood 2", "Tales from the Hood 3", "Murder in the Woods", "Kandisha", "Gang of Souls", "The House Invictus", "The Angry Black Girl and Her Monster", "Surrounded", "They Remain", "Jacob's Ladder", "House Party: Tonight's the Night", "The Summoned", "The Inheritance", "Killjoy", "Killjoy 2: Deliverance from Evil", "Killjoy 3", "Killjoy Goes to Hell", "Killjoy's Psycho Circus", "Ragdoll", "Hellbound", "Beneath Loch Ness", "Motives", "Motives 2", "The Grim Reaper", "Wes Craven Presents: Dracula II Ascension", "Wes Craven Presents: Dracula III Legacy", "The Horrible Dr. Bones", "Zombiez", "Holla", "The Maintenance Man", "Nite Tales", "Nite Tales: The Movie", "The Dread", "Circle of Eight", "Trapped: Haitian Nights", "The Dead One", "Shallow Ground", "The Fear Chamber", "I Madman", "Killer Weekend", "Boo", "The Cookout", "Somebody Help Me", "Somebody Help Me 2", "Chain Letter", "Cutthroat Alley", "Killer Instinct", "BlinkyTM", "Camp Blood 8: Revelations", "Jigsaw", "Slaughter's Big Rip-Off", "The Skarehouse", "Minutes Past Midnight", "Hell Fest", "There's Someone Inside Your House", "Initiation", "Carnival of Souls", "House of Fears"];
            const uniqueTitles = Array.from(new Set(BLACK_HORROR_TITLES.map(t => t.toLowerCase().trim()))).map(t => BLACK_HORROR_TITLES.find(orig => orig.toLowerCase().trim() === t));
            const titlePromises = uniqueTitles.slice(0, 40).map(title => fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(title)}`).then(r => r.json()));
            const titleResults = await Promise.all(titlePromises);
            titleResults.forEach(data => { if(data.results) pool.push(...data.results); });
            let uniquePool = Array.from(new Map(pool.map(m => [m.id, m])).values());
            let validated = [];
            for (let movie of uniquePool) {
                const detailRes = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}?api_key=${API_KEY}&append_to_response=credits,keywords`);
                const details = await detailRes.json();
                const movieObj = { ...details, director: details.credits?.crew?.find(c => c.job === 'Director')?.name || "", cast: details.credits?.cast?.slice(0, 10).map(a => a.name) || [], genres: details.genres?.map(g => g.name) || [], keywords: details.keywords?.keywords?.map(k => k.name) || [], production_companies: details.production_companies?.map(p => p.name) || [] };
                if (isBlackHorror(movieObj)) validated.push(movieObj);
            }
            displayBlackHorror(validated);
        }

        function isBlackHorror(movie) {
            const blackDirectors = ['Jordan Peele', 'Nia DaCosta', 'Rusty Cundieff', 'Kasi Lemmons', 'Ernest Dickerson', 'William Crain', 'Remi Weekes', 'Nikyatu Jusu', 'Emmanuel Osei-Kuffour', 'Gerard McMurray', 'Tony Todd', 'Keenen Ivory Wayans'];
            const blackActors = ['Lupita Nyong\'o', 'Daniel Kaluuya', 'Janelle Monáe', 'Gabrielle Union', 'Omari Hardwick', 'Logan Browning', 'Tony Todd', 'Eddie Murphy', 'Angela Bassett', 'Wesley Snipes', 'Tasha Smith', 'Regina Hall', 'Keke Palmer', 'Laurence Fishburne'];
            return blackDirectors.includes(movie.director) || (movie.genres.includes('Horror') && movie.cast.some(actor => blackActors.includes(actor))) || movie.keywords.includes('blaxploitation');
        }

        function displayBlackHorror(movies) {
            const container = document.getElementById('black-horror-section');
            container.innerHTML = '';
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card focusable'; card.tabIndex = 0;
                card.onclick = () => openDetails(movie.id, 'movie');
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" class="w-full h-full object-cover"><div class="movie-info horror-font"><h3 class="text-red-600 font-bold truncate">${movie.title}</h3><p>${movie.release_date ? movie.release_date.split('-')[0] : 'Unknown'}</p></div>`;
                container.appendChild(card);
            });
        }

        function renderGrid(results) {
            const grid = document.getElementById('movie-grid');
            if (!results) return;
            results.forEach(m => {
                const card = document.createElement('div');
                card.className = "movie-card focusable"; card.tabIndex = 0;
                if (!m.poster_path) return;
                const type = m.media_type || (m.first_air_date ? 'tv' : 'movie');
                card.onclick = () => openDetails(m.id, type);
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover">`;
                grid.appendChild(card);
            });
        }

        async function openDetails(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`);
            const data = await res.json();
            currentMedia = { id, type, s: 1, e: 1, title: data.name || data.title, poster: data.poster_path };
            document.getElementById('show-title').innerText = currentMedia.title;
            document.getElementById('show-desc').innerText = data.overview || "";
            document.getElementById('show-year').innerText = (data.release_date || data.first_air_date || '').split('-')[0];
            document.getElementById('show-rating').innerText = data.vote_average ? data.vote_average.toFixed(1) : '★';
            document.getElementById('details-poster').src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
            document.getElementById('details-backdrop').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.backdrop_path})`;
            document.getElementById('media-type-tag').innerText = type.toUpperCase();
            const tvArea = document.getElementById('tv-controls');
            if (type === 'tv') { tvArea.classList.remove('hidden'); renderSeasons(data); } else { tvArea.classList.add('hidden'); }
            document.getElementById('main-app-wrapper').classList.add('hidden');
            document.getElementById('selector-overlay').classList.remove('hidden');
            window.scrollTo(0, 0);
            setTimeout(() => document.getElementById('main-play-trigger').focus(), 300);
        }

        function renderSeasons(data) {
            const container = document.getElementById('season-buttons'); container.innerHTML = '';
            if(!data.seasons) return;
            data.seasons.forEach(s => {
                if (s.season_number === 0) return;
                const btn = document.createElement('button');
                btn.className = "focusable px-6 py-2 bg-zinc-900 rounded horror-font text-lg border border-zinc-800 whitespace-nowrap";
                btn.innerText = `Season ${s.season_number}`;
                btn.onclick = () => loadEpisodes(data.id, s.season_number);
                container.appendChild(btn);
            });
            if(container.firstChild) container.firstChild.click();
        }

        async function loadEpisodes(showId, seasonNum) {
            const res = await fetch(`https://api.themoviedb.org/3/tv/${showId}/season/${seasonNum}?api_key=${API_KEY}`);
            const data = await res.json();
            const grid = document.getElementById('episode-grid'); grid.innerHTML = '';
            data.episodes.forEach(e => {
                const epRow = document.createElement('div');
                epRow.className = "episode-row focusable"; epRow.tabIndex = 0;
                epRow.onclick = () => { currentMedia.s = seasonNum; currentMedia.e = e.episode_number; startLuxeStream(); };
                const thumb = e.still_path ? `https://image.tmdb.org/t/p/w300${e.still_path}` : '';
                epRow.innerHTML = `<div class="ep-thumbnail" style="background-image:url(${thumb})"><div class="ep-play-icon">▶</div></div><div class="flex-1"><div class="text-white font-bold">E${e.episode_number} ${e.name}</div><div class="text-zinc-500 text-xs line-clamp-1">${e.overview}</div></div>`;
                grid.appendChild(epRow);
            });
        }

        function startLuxeStream() {
            const { type, id, s, e } = currentMedia;
            const playerOverlay = document.getElementById('player-overlay');
            const iframe = document.getElementById('luxe-player');
            playerOverlay.style.display = 'block';
            iframe.src = (type === 'movie' ? `https://vidsrc.cc/v2/embed/movie/${id}` : `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}`);
            setTimeout(() => document.getElementById('close-player-btn').focus(), 500);
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
        function closeSelector() { document.getElementById('selector-overlay').classList.add('hidden'); document.getElementById('main-app-wrapper').classList.remove('hidden'); }
        function closePlayer() { document.getElementById('luxe-player').src = ""; document.getElementById('player-overlay').style.display = 'none'; }
        
        function setFilter(type, id = '') {
            activeType = type; activeID = id;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            if(event && event.target.tagName === 'BUTTON') event.target.classList.add('nav-active');
            fetchContent();
            document.getElementById('side-menu').classList.remove('menu-open');
            window.scrollTo(0,0);
        }

        function handleSearch(e) { if (e.key === 'Enter') { activeType = 'search'; activeID = e.target.value; fetchContent(); e.target.blur(); } }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace') {
                if (document.getElementById('player-overlay').style.display === 'block') closePlayer();
                else if (!document.getElementById('selector-overlay').classList.contains('hidden')) closeSelector();
            }
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const dir = e.key.replace('Arrow', '').toLowerCase();
                const next = findNext(document.activeElement, Array.from(document.querySelectorAll('.focusable')).filter(el => el.offsetParent !== null), dir);
                if (next) { next.focus(); next.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            }
        });

        function findNext(cur, targets, dir) {
            if (!cur || cur === document.body) return targets[0];
            const r1 = cur.getBoundingClientRect(), c1 = { x: r1.left + r1.width/2, y: r1.top + r1.height/2 };
            let best = null, min = Infinity;
            targets.forEach(t => {
                if (t === cur) return;
                const r2 = t.getBoundingClientRect(), c2 = { x: r2.left + r2.width/2, y: r2.top + r2.height/2 };
                if (dir === 'up' && c2.y >= c1.y) return; if (dir === 'down' && c2.y <= c1.y) return;
                if (dir === 'left' && c2.x >= c1.x) return; if (dir === 'right' && c2.x <= c1.x) return;
                const d = Math.sqrt(Math.pow(c2.x - c1.x, 2) + Math.pow(c2.y - c1.y, 2));
                if (d < min) { min = d; best = t; }
            });
            return best;
        }

        window.onload = () => {
            fetchContent();
            setTimeout(() => { 
                const loader = document.getElementById('loader');
                if(loader) { loader.style.opacity = '0'; setTimeout(()=>loader.remove(), 800); }
            }, 1200);
            const obs = new IntersectionObserver(e => { if(e[0].isIntersecting && activeType !== 'after_dark') fetchContent(true); });
            obs.observe(document.getElementById('sentinel'));
        };
    </script>
</body>
