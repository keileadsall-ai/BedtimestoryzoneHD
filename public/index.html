            function killLoader(){
                try {
                    var l = document.getElementById('loader');
                    if (l && l.parentNode) {
                        l.style.transition = 'opacity 0.3s ease';
                        l.style.opacity = '0';
                        setTimeout(function(){
                            try { if (l && l.parentNode) l.parentNode.removeChild(l); } catch(e) {}
                        }, 350);
                    }
                } catch(e) {}
            }
            setTimeout(killLoader, 1500);
            setTimeout(killLoader, 3000);
            setTimeout(killLoader, 6000);
            try {
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', function(){ setTimeout(killLoader, 1800); });
                }
            } catch(e) {}
        })();

        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem('fear_plus_favorites') || '[]');
            } catch (e) {
                return [];
            }
        }

        function isFavorite(id) {
            const favs = getFavorites();
            return favs.some(f => String(f.id) === String(id));
        }

        function updateFavoriteHeartUI() {
            const btn = document.getElementById('fav-toggle-btn');
            if (!btn || !currentMedia.id) return;
            if (isFavorite(currentMedia.id)) {
                btn.classList.add('is-fav');
            } else {
                btn.classList.remove('is-fav');
            }
        }

        function toggleCurrentFavorite() {
            if (!currentMedia || !currentMedia.id) return;
            let favs = getFavorites();
            const existsIndex = favs.findIndex(f => String(f.id) === String(currentMedia.id));

            if (existsIndex > -1) {
                favs.splice(existsIndex, 1);
            } else {
                favs.unshift({
                    id: currentMedia.id,
                    media_type: currentMedia.type,
                    title: currentMedia.title,
                    name: currentMedia.title,
                    poster_path: currentMedia.poster,
                    release_date: currentMedia.year || ''
                });
            }
            localStorage.setItem('fear_plus_favorites', JSON.stringify(favs));
            updateFavoriteHeartUI();
            if (activeType === 'favorites') {
                renderFavoritesGrid();
            }

        function renderFavoritesGrid() {
            const grid = document.getElementById('movie-grid');

        async function fetchWithRetry(url, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return await res.json();
                    if (res.status === 429) {
                        await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1))); 
                        continue;
                    }
                    break;
                } catch(e) {
                    if (i === retries - 1) return null;
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
            }
            return null;
        }

        const imdbCache = new Map();
        async function fetchTMDBFromIMDb(imdbId) {
            if (imdbCache.has(imdbId)) return imdbCache.get(imdbId);
            try {
                const data = await fetchWithRetry(`https://api.themoviedb.org/3/find/${imdbId}?api_key=${API_KEY}&external_source=imdb_id`);
                if (data && data.movie_results && data.movie_results.length > 0) {
                    const result = { id: data.movie_results[0].id, type: 'movie' };
                    imdbCache.set(imdbId, result);
                    return result;
                } else if (data && data.tv_results && data.tv_results.length > 0) {
                    const result = { id: data.tv_results[0].id, type: 'tv' };
                    imdbCache.set(imdbId, result);
                    return result;
                }
            } catch (e) {}
            return null;
        }

        async function resolveItemsFromImdbList(imdbIds, idSet) {
            const promises = imdbIds.map(async (imdbId) => {
                const tmdb = await fetchTMDBFromIMDb(imdbId);
                if (tmdb && !idSet.has(tmdb.id)) {
                    try {
                        const data = await fetchWithRetry(`https://api.themoviedb.org/3/${tmdb.type}/${tmdb.id}?api_key=${API_KEY}`);
                        if (data && data.poster_path) {
                            idSet.add(tmdb.id);
                            return { ...data, media_type: tmdb.type, id: tmdb.id };
                        }
                    } catch (e) {}
                }
                return null;
            });
            const items = await Promise.all(promises);
            return items.filter(Boolean);
        }

        async function fetchExtraBlackHorrorTitles(idSet) {
            const promises = BLACK_HORROR_NEW_TITLES.map(({ title, year }) => {
                const movieUrl = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(title)}&primary_release_year=${year}`;
                const tvUrl = `https://api.themoviedb.org/3/search/tv?api_key=${API_KEY}&query=${encodeURIComponent(title)}&first_air_date_year=${year}`;
                return Promise.all([
                    fetchWithRetry(movieUrl).catch(() => null),
                    fetchWithRetry(tvUrl).catch(() => null)
                ]).then(([movieData, tvData]) => {
                    const candidates = [];
                    if (movieData && movieData.results) {
                        movieData.results.forEach(m => candidates.push({ ...m, media_type: 'movie' }));
                    }
                    if (tvData && tvData.results) {
                        tvData.results.forEach(t => candidates.push({ ...t, media_type: 'tv' }));
                    }
                    const yearMatches = candidates.filter(m => {
                        if (!m.poster_path) return false;
                        const yearStr = ((m.release_date || m.first_air_date) || '').split('-')[0];
                        const y = parseInt(yearStr, 10);
                        return y === year;
                    });
                    if (yearMatches.length > 0) return yearMatches[0];
                    const nearMatches = candidates.filter(m => {
                        if (!m.poster_path) return false;
                        const yearStr = ((m.release_date || m.first_air_date) || '').split('-')[0];
                        const y = parseInt(yearStr, 10);
                        return Math.abs(y - year) <= 1;
                    });
                    return nearMatches[0] || null;
                });
            });
            const fetchedResults = await Promise.all(promises);
            const items = [];
            fetchedResults.forEach(m => {
                if (m && !idSet.has(m.id)) {
                    idSet.add(m.id);
                    items.push({ ...m, media_type: m.media_type || (m.first_air_date ? 'tv' : 'movie') });
                }
            });
            return items;
        }

                    const nearMatches = candidates.filter(m => {
                        if (!m.poster_path) return false;
                        const yearStr = ((m.release_date || m.first_air_date) || '').split('-')[0];
                        const y = parseInt(yearStr, 10);
                        return Math.abs(y - year) <= 1;
                    });
                    return nearMatches[0] || null;
                });
            });
            const fetchedResults = await Promise.all(promises);
            const items = [];
            fetchedResults.forEach(m => {
                if (m && !idSet.has(m.id)) {
                    idSet.add(m.id);
                    items.push({ ...m, media_type: m.media_type || (m.first_air_date ? 'tv' : 'movie') });
                }
            });

        }

        function renderGrid(results) {
            const grid = document.getElementById('movie-grid');
            if (!results) return;
            results.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = "movie-card focusable fade-in"; card.tabIndex = 0;
                const type = m.media_type || (m.first_air_date ? 'tv' : 'movie');
                card.onclick = () => openDetails(m.id, type);
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover"><div class="movie-info horror-font"><h3 class="text-red-600 font-bold truncate">${m.title || m.name}</h3><p>${(m.release_date || m.first_air_date || '').split('-')[0]}</p></div>`;
                grid.appendChild(card);
            });
        }

        async function openDetails(id, type) {
            savedScrollPosition = window.scrollY || document.documentElement.scrollTop; 
            lastFocusedElement = document.activeElement; 

            const data = await fetchWithRetry(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`);
            if (!data) return;
            
            const images = await fetchWithRetry(`https://api.themoviedb.org/3/${type}/${id}/images?api_key=${API_KEY}`);
            let backdropUrl = `https://image.tmdb.org/t/p/original${data.backdrop_path}`;
            if (images && images.backdrops && images.backdrops.length > 0) {
                const bestImage = images.backdrops[1] || images.backdrops[0];
                backdropUrl = `https://image.tmdb.org/t/p/original${bestImage.file_path}`;
            }
            
            const isAnime = data.original_language === 'ja' && data.genres && data.genres.some(g => g.name === 'Animation');

            currentMedia = { 
                id, 
                type, 
                s: 1, 
                e: 1, 
                title: data.name || data.title, 
                poster: data.poster_path, 
                isAnime,
                year: (data.release_date || data.first_air_date || '').split('-')[0]
            };
            document.getElementById('show-title').innerText = currentMedia.title;
            document.getElementById('show-desc').innerText = data.overview || "";
            document.getElementById('show-year').innerText = currentMedia.year;
            document.getElementById('show-rating').innerText = data.vote_average ? data.vote_average.toFixed(1) : '★';
            document.getElementById('details-poster').src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
            
            const backdrop = document.getElementById('details-backdrop');
            backdrop.style.backgroundImage = `url(${backdropUrl})`;
            backdrop.classList.remove('blur-2xl');

            document.getElementById('media-type-tag').innerText = type.toUpperCase();
            
            updateFavoriteHeartUI();

            const tvArea = document.getElementById('tv-controls');
            if (type === 'tv') { tvArea.classList.remove('hidden'); renderSeasons(data); } else { tvArea.classList.add('hidden'); }
            
            document.getElementById('main-app-wrapper').classList.add('hidden');
            document.getElementById('selector-overlay').classList.remove('hidden');
            window.scrollTo(0, 0);
            setTimeout(() => document.getElementById('main-play-trigger').focus(), 300);
        }

        function renderSeasons(data) {
            const container = document.getElementById('season-buttons'); 
            container.innerHTML = '';
            if(!data.seasons) return;

            const validSeasons = data.seasons.filter(s => s.season_number > 0);
            const leftArrow = document.getElementById('season-arrow-left');
            const rightArrow = document.getElementById('season-arrow-right');

            if (validSeasons.length > 1) {
                leftArrow.classList.remove('hidden');
                rightArrow.classList.remove('hidden');
            } else {
                leftArrow.classList.add('hidden');
                rightArrow.classList.add('hidden');
            }

            validSeasons.forEach(s => {
                const btn = document.createElement('button');
                btn.className = "focusable px-6 py-2 bg-zinc-900 rounded horror-font text-lg border border-zinc-800 whitespace-nowrap flex-shrink-0";
                btn.innerText = `Season ${s.season_number}`;
                btn.onclick = () => loadEpisodes(data.id, s.season_number);
                
                btn.addEventListener('focus', function() {
                    setTimeout(() => {
                        container.scrollLeft = this.offsetLeft - (container.offsetWidth / 2) + (this.offsetWidth / 2);
                    }, 50);
                });

                container.appendChild(btn);
            });
            if(container.firstChild) container.firstChild.click();
        }

        function scrollSeasons(amount) {
            const container = document.getElementById('season-buttons');
            if(container) {
                container.scrollBy({ left: amount, behavior: 'smooth' });
            }
        }

        async function loadEpisodes(showId, seasonNum) {
            const data = await fetchWithRetry(`https://api.themoviedb.org/3/tv/${showId}/season/${seasonNum}?api_key=${API_KEY}`);
            if(!data) return;
            const grid = document.getElementById('episode-grid'); grid.innerHTML = '';
            data.episodes.forEach(e => {
                const epRow = document.createElement('div');
                epRow.className = "episode-row focusable"; epRow.tabIndex = 0;
                epRow.onclick = () => { 
                    currentMedia.s = seasonNum; 
                    currentMedia.e = e.episode_number; 
                    saveToContinue(currentMedia); 
                    startLuxeStream(); 
                };
                const thumb = e.still_path ? `https://image.tmdb.org/t/p/w300${e.still_path}` : '';
                epRow.innerHTML = `<div class="ep-thumbnail" style="background-image:url(${thumb})"><div class="ep-play-icon">▶</div></div><div class="flex-1"><div class="text-white font-bold">E${e.episode_number} ${e.name}</div><div class="text-zinc-500 text-xs line-clamp-1">${e.overview}</div></div>`;
                grid.appendChild(epRow);
            });
        }

        async function startLuxeStream() {
            const { type, id, s, e, isAnime, title, poster } = currentMedia;
            saveToContinue(currentMedia);
            const playerOverlay = document.getElementById('player-overlay');
            const iframe = document.getElementById('luxe-player');
            playerOverlay.style.display = 'block';
            
            const vidsrcUrl = (type === 'movie' 
                ? `https://vidsrc.to/embed/movie/${id}` 
                : `https://vidsrc.to/embed/tv/${id}/${s}/${e}`);
            
            const consumetUrl = `https://consumet-api-fawn.vercel.app/anime/gogoanime/watch/${encodeURIComponent(title.toLowerCase().replace(/ /g, '-'))}-episode-${e}`;

            iframe.src = "about:blank"; 
            if (isAnime) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 1200); 
                    const response = await fetch(consumetUrl, { method: 'HEAD', signal: controller.signal });
                    setTimeout(() => clearTimeout(timeoutId), 0);
                    iframe.src = response.ok ? consumetUrl : vidsrcUrl;
                } catch (err) { iframe.src = vidsrcUrl; }
            } else { 
                iframe.src = vidsrcUrl; 
            }

            setTimeout(() => { if(document.getElementById('close-player-btn')) document.getElementById('close-player-btn').focus(); }, 400);
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
        
        function closeSelector() { 
            document.getElementById('selector-overlay').classList.add('hidden'); 
            document.getElementById('main-app-wrapper').classList.remove('hidden'); 
            window.scrollTo(0, savedScrollPosition); 
            if (lastFocusedElement) {
                lastFocusedElement.focus();
            } else {
                document.getElementById('btn-trending').focus(); 
            }
        }
        
        function closePlayer() { 
            document.getElementById('luxe-player').src = "about:blank"; 
            document.getElementById('player-overlay').style.display = 'none'; 
            document.getElementById('main-play-trigger').focus();
        }
        
        function setFilter(type, id = '') {
            activeType = type; activeID = id;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            if(window.event && window.event.target && window.event.target.tagName === 'BUTTON') {
                window.event.target.classList.add('nav-active');
            }
            if (type === 'favorites') {
                renderFavoritesGrid();
            } else {
                fetchContent();
            }
            document.getElementById('side-menu').classList.remove('menu-open');
            window.scrollTo(0,0);
        }

        function triggerSearch() {
            const input = document.getElementById('search-input');
            const query = input.value.trim();
            if(query) {
                setFilter('search', query);
                input.blur();
                setTimeout(() => {
                    const firstResult = document.querySelector('#movie-grid .focusable');
                    if(firstResult) firstResult.focus();
                }, 800);
            } else {
                input.blur();
                setFilter('trending_theaters');
                document.getElementById('btn-trending').classList.add('nav-active');
            }
        }

        function handleSearch(e) { if (e.key === 'Enter') triggerSearch(); }

        document.addEventListener('keydown', function(e) {
            const current = document.activeElement;
            const focusables = Array.from(document.querySelectorAll('.focusable')).filter(el => el.offsetParent !== null);
            
            if (e.key === 'Backspace' || e.keyCode === 8 || e.keyCode === 10009) {
                if (current && current.id === 'search-input') return; 
                e.preventDefault();
                if (document.getElementById('player-overlay').style.display === 'block') closePlayer();
                else if (!document.getElementById('selector-overlay').classList.contains('hidden')) closeSelector();
                else if (document.getElementById('side-menu').classList.contains('menu-open')) toggleMenu();
                return;
            }

            if (e.key === 'Enter' || e.keyCode === 13) { 
                if (current && current.id === 'search-input') { triggerSearch(); return; }
                if (current && current.id === 'search-action-btn') { triggerSearch(); return; }
                if (current && current.classList.contains('focusable')) { current.click(); return; }
            }

            let dir = '';
            if (e.key === 'ArrowUp') dir = 'up'; if (e.key === 'ArrowDown') dir = 'down'; if (e.key === 'ArrowLeft') dir = 'left'; if (e.key === 'ArrowRight') dir = 'right';
            if (dir) {
                e.preventDefault();
                const next = findNext(current, focusables, dir);
                if (next) { next.focus(); next.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            }
        });

        function findNext(cur, targets, dir) {
            if (!cur || cur === document.body) return targets[0];
            const r1 = cur.getBoundingClientRect(), c1 = { x: r1.left + r1.width/2, y: r1.top + r1.height/2 };
            let best = null, min = Infinity;
            targets.forEach(t => {
                if (t === cur) return;
                const r2 = t.getBoundingClientRect(), c2 = { x: r2.left + r2.width/2, y: r2.top + r2.height/2 };
                if (dir === 'up' && c2.y >= c1.y) return; if (dir === 'down' && c2.y <= c1.y) return;
                if (dir === 'left' && c2.x >= c1.x) return; if (dir === 'right' && c2.x <= c1.x) return;
                const d = Math.sqrt(Math.pow(c2.x - c1.x, 2) + Math.pow(c2.y - c1.y, 2));
                if (d < min) { min = d; best = t; }
            });
            return best;
        }

        function setupNavigationArrows() {
            const topNavMenu = document.getElementById('top-nav-menu');
            const topNavContainer = document.getElementById('top-nav-container');
            
            if (topNavMenu && topNavContainer) {
                const leftArrow = document.createElement('button');
                leftArrow.className = 'focusable absolute left-0 z-50 bg-black/90 text-red-600 font-bold px-3 py-2 border border-red-900/40 rounded-r-lg shadow-2xl';
                leftArrow.innerHTML = '❮';
                leftArrow.onclick = () => topNavMenu.scrollBy({ left: -200, behavior: 'smooth' });

                const rightArrow = document.createElement('button');
                rightArrow.className = 'focusable absolute right-0 z-50 bg-black/90 text-red-600 font-bold px-3 py-2 border border-red-900/40 rounded-l-lg shadow-2xl';
                rightArrow.innerHTML = '❯';
                rightArrow.onclick = () => topNavMenu.scrollBy({ left: 200, behavior: 'smooth' });

                topNavContainer.appendChild(leftArrow);
                topNavContainer.appendChild(rightArrow);

                topNavMenu.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('focus', function() {
                        setTimeout(() => {
                            topNavMenu.scrollLeft = this.offsetLeft - (topNavMenu.offsetWidth / 2) + (this.offsetWidth / 2);
                        }, 100);
                    });
                });
            }

            const sideScrollArea = document.getElementById('side-scroll-area');
            const sideMenu = document.getElementById('side-menu');
            
            if (sideScrollArea && sideMenu) {
                const upArrow = document.createElement('button');
                upArrow.className = 'focusable absolute top-20 left-1/2 -translate-x-1/2 z-50 bg-black/90 text-red-600 font-bold px-6 py-1 border border-red-900/40 rounded-full shadow-2xl';
                upArrow.innerHTML = '▲';
                upArrow.onclick = () => sideScrollArea.scrollBy({ top: -150, behavior: 'smooth' });

                const downArrow = document.createElement('button');
                downArrow.className = 'focusable absolute bottom-4 left-1/2 -translate-x-1/2 z-50 bg-black/90 text-red-600 font-bold px-6 py-1 border border-red-900/40 rounded-full shadow-2xl';
                downArrow.innerHTML = '▼';
                downArrow.onclick = () => sideScrollArea.scrollBy({ top: 150, behavior: 'smooth' });

                sideMenu.appendChild(upArrow);
                sideMenu.appendChild(downArrow);

                sideScrollArea.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('focus', function() {
                        setTimeout(() => {
                            sideScrollArea.scrollTop = this.offsetTop - (sideScrollArea.offsetHeight / 2) + (this.offsetHeight / 2);
                        }, 100);
                    });
                });
            }
        }

        window.onload = () => {
            try {
                const ua = navigator.userAgent.toLowerCase();
                if (ua.includes('firetv') || ua.includes('aftb') || ua.includes('afts') || ua.includes('smarttv') || ua.includes('appletv')) {
                    document.body.classList.add('is-tv');
                }
            } catch (e) { console.error('UA check failed:', e); }

            try { setupNavigationArrows(); } catch (e) { console.error('setupNavigationArrows failed:', e); }
            try { fetchContent(); } catch (e) { console.error('fetchContent failed:', e); }
            try { loadContinueWatching(); } catch (e) { console.error('loadContinueWatching failed:', e); }

            try {
                const obs = new IntersectionObserver(e => { 
                    if(e[0].isIntersecting && activeType !== 'after_dark' && activeType !== 'favorites' && activeType !== 'shudder') fetchContent(true); 
                });
                obs.observe(document.getElementById('sentinel'));
            } catch (e) { console.error('IntersectionObserver failed:', e); }

            setTimeout(() => { 
                const loader = document.getElementById('loader');
                if(loader) { loader.style.opacity = '0'; setTimeout(()=>loader.remove(), 800); }
            }, 1200);
        };
    </script>
