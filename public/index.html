
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fear+ | The Final Ritual</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Metal+Mania&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
    <style>
        :root { --blood: #b30000; --void: #020202; --smoke: rgba(10, 10, 10, 0.98); --glow: rgba(179, 0, 0, 0.4); }
        
        @media screen and (min-width: 900px) {
            body { padding: 2% 5% !important; }
            .details-content { flex-direction: row !important; align-items: flex-start !important; gap: 50px !important; margin-top: -25vh !important; }
            .main-poster { width: 320px !important; }
            .hero-bg { height: 60vh !important; }
        }

        * { box-sizing: border-box; scrollbar-width: none; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }

        body { 
            margin: 0; background: var(--void); color: #eee; 
            font-family: 'Metal Mania', cursive; overflow-x: hidden;
            background-image: radial-gradient(circle at center, #1a0000 0%, #000 100%);
        }

        :focus { outline: 4px solid var(--blood) !important; outline-offset: 4px; transform: scale(1.05) !important; z-index: 9999; box-shadow: 0 0 50px var(--blood) !important; }

        .menu-btn { position: fixed; top: 20px; left: 20px; z-index: 3000; background: var(--blood); color: white; border: none; padding: 12px 20px; font-family: 'Creepster'; cursor: pointer; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        #loader { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s; }
        .voodoo-container { width: 250px; height: 250px; border-radius: 50%; overflow: hidden; border: 3px solid var(--blood); }
        .medusa-heart { width: 100%; height: 100%; object-fit: cover; animation: ritualThump 0.9s infinite; }
        @keyframes ritualThump { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } }

        header { width: 100%; height: 50vh; background: linear-gradient(to bottom, transparent, var(--void)), url('IMG_8238.jpeg') no-repeat center top; background-size: cover; border-bottom: 3px solid var(--blood); position: relative; }
        .logo { position: absolute; bottom: 30px; left: 5%; font-family: 'Nosifer'; font-size: clamp(3rem, 15vw, 7rem); color: var(--blood); text-shadow: 0 0 30px #000; }

        .sticky-altar { position: sticky; top: 0; z-index: 1000; background: var(--smoke); backdrop-filter: blur(10px); padding: 15px; border-bottom: 1px solid #222; }
        .search-input { width: 100%; background: #000; border: 1px solid var(--blood); padding: 18px; color: var(--blood); font-family: 'Creepster'; font-size: 1.5rem; outline: none; }

        #side-menu { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background: #000; border-right: 3px solid var(--blood); z-index: 4000; transition: 0.3s; padding: 80px 25px; }
        #side-menu.open { left: 0; }
        .side-link { padding: 15px 0; color: #555; font-size: 1.8rem; cursor: pointer; border-bottom: 1px solid #111; outline: none; transition: 0.3s; }
        .side-link:focus, .side-link:hover { color: var(--blood); padding-left: 10px; }

        .horror-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 15px; }
        .card { aspect-ratio: 2/3; background: #080808; border: 1px solid #111; cursor: pointer; overflow: hidden; outline: none; transition: 0.4s; }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        .compact-card { width: 90px; height: 135px; flex-shrink: 0; border: 1px solid #222; outline: none; cursor: pointer; overflow: hidden; transition: 0.3s; }
        .compact-card img { width: 100%; height: 100%; object-fit: cover; }

        #ritual-screen { position: fixed; inset: 0; background: var(--void); z-index: 5000; display: none; overflow-y: auto; }
        .hero-bg { width: 100%; height: 45vh; background-size: cover; background-position: center; position: relative; overflow: hidden; }
        .hero-backdrop { position: absolute; inset: 0; background-size: cover; background-position: center; animation: kenBurns 40s infinite alternate; filter: brightness(0.7); }
        @keyframes kenBurns { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, var(--void) 95%); }

        .details-content { display: flex; flex-direction: column; padding: 20px; max-width: 1400px; margin: -15vh auto 0; position: relative; z-index: 10; }
        .main-poster { width: 220px; border: 3px solid var(--blood); flex-shrink: 0; align-self: center; box-shadow: 0 10px 60px #000; }
        
        .play-btn { background: var(--blood); color: white; border: none; width: 100%; padding: 22px; font-family: 'Creepster'; font-size: 2rem; cursor: pointer; margin: 25px 0; outline: none; border-radius: 8px; }

        .season-row { display: flex; overflow-x: auto; gap: 8px; padding: 10px 0; }
        .pill { padding: 10px 18px; background: rgba(10,10,10,0.8); border: 1px solid #222; color: #777; font-family: sans-serif; cursor: pointer; outline: none; border-radius: 4px; }
        .pill.active { border-color: var(--blood); color: var(--blood); font-family: 'Creepster'; }

        .player-mount { width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid #333; margin: 30px 0; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="loader">
    <div class="voodoo-container"><img src="IMG_8259.jpeg" class="medusa-heart"></div>
    <h2 style="font-family:'Nosifer'; color:var(--blood); margin-top:20px;">Dead Yet?</h2>
</div>

<button class="menu-btn" tabindex="0" onclick="toggleSideMenu()">MENU</button>

<div id="side-menu">
    <h3 style="color:var(--blood); font-family:'Nosifer';">THE VAULTS</h3>
    <div class="side-link" tabindex="0" onclick="setMode('movies')">ALL MOVIES</div>
    <div class="side-link" tabindex="0" onclick="setMode('shudder')">SHUDDER</div>
    <div class="side-link" tabindex="0" onclick="setMode('fx')">FX HORROR</div>
    <div class="side-link" tabindex="0" onclick="setMode('hulu')">HULU BLOOD</div>
    <div class="side-link" tabindex="0" onclick="setMode('hoodoo')">HOODOO FILMS</div>
    <div class="side-link" tabindex="0" onclick="setMode('70s')">70s SLASHERS</div>
</div>

<header><div class="logo">FEAR+</div></header>

<div class="sticky-altar">
    <input type="text" id="search" class="search-input" placeholder="SEARCH SACRIFICE..." onkeyup="handleSearch(event)">
</div>

<main>
    <div class="horror-grid" id="main-grid"></div>

    <section id="resume-ritual" style="display:none; padding:20px 20px 40px; border-top: 2px solid #111; margin-top: 30px;">
        <h2 style="color:var(--blood); font-family:'Creepster'; font-size:1.5rem; margin:0 0 15px;">CONTINUE WATCHING</h2>
        <div id="continue-grid" style="display:flex; overflow-x:auto; gap:10px; padding-bottom: 5px;"></div>
    </section>

    <div id="sentinel" style="height: 100px;"></div>
</main>

<div id="ritual-screen">
    <div id="hero-bg" class="hero-bg"><div id="hero-backdrop" class="hero-backdrop"></div><div class="hero-overlay"></div></div>
    <div class="details-content">
        <img id="det-poster" class="main-poster">
        <div style="flex: 1;">
            <button tabindex="0" onclick="closeRitual()" style="background:transparent; color:white; border:1px solid rgba(255,255,255,0.3); padding:8px 20px; cursor:pointer; font-family:'Creepster'; margin-bottom:15px;">← BACK</button>
            <h1 id="det-title" style="font-family:'Nosifer'; color:white; margin:10px 0;"></h1>
            <p id="det-meta" style="color:var(--blood); font-size:1.3rem; margin-bottom: 20px;"></p>
            <button id="play-btn" tabindex="0" class="play-btn" onclick="showPlayer()">PLAY NOW</button>
            <div id="tv-controls" style="display:none; background: rgba(15,15,15,0.8); padding: 20px; border-radius: 8px; border: 1px solid #222; margin-bottom: 20px;">
                <h4 style="margin:0; color:#aaa; font-family:'IM Fell English SC', serif;">SEASONS</h4>
                <div id="s-row" class="season-row"></div>
                <h4 style="margin:15px 0 0; color:#aaa; font-family:'IM Fell English SC', serif;">EPISODES</h4>
                <div id="e-row" class="season-row"></div>
            </div>
            <div style="padding: 10px; border-left: 2px solid var(--blood); background: rgba(10,10,10,0.5);">
                <p id="det-desc" style="font-family:'IM Fell English SC', serif; color:#bbb; line-height:1.7; font-size:1.2rem; margin:0;"></p>
            </div>
            <div id="player-mount" class="player-mount"></div>
        </div>
    </div>
</div>

<script>
    const API_KEY = 'b9c746781e1e9b084c4cc4f0420156d4';
    let page = 1, mode = 'movies', fetching = false, selected = null, currentS = 1;

    function toggleSideMenu() {
        const m = document.getElementById('side-menu');
        m.classList.toggle('open');
        if(m.classList.contains('open')) m.querySelector('.side-link').focus();
    }

    async function load(reset = false) {
        if(reset) { page = 1; document.getElementById('main-grid').innerHTML = ''; }
        if(fetching) return;
        fetching = true;
        
        let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&page=${page}&sort_by=popularity.desc`;
        
        // Vault Infinite Scrolling Logic
        if(mode === 'shudder') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_networks=2506&page=${page}`;
        else if(mode === 'fx') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_networks=88&page=${page}`;
        else if(mode === 'hulu') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&with_networks=453&page=${page}`;
        else if(mode === 'hoodoo') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&with_keywords=210214|155477&page=${page}`;
        else if(mode === '70s') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&primary_release_date.gte=1970-01-01&primary_release_date.lte=1979-12-31&page=${page}`;

        try {
            const res = await fetch(url);
            const data = await res.json();
            if(data.results) render(data.results, 'main-grid');
        } catch(e) { console.error("Ritual Failed", e); }
        fetching = false;
    }

    function render(items, gridId) {
        const grid = document.getElementById(gridId);
        items.forEach(item => {
            if(!item.poster_path) return;
            const card = document.createElement('div');
            card.className = gridId === 'main-grid' ? 'card' : 'compact-card';
            card.setAttribute('tabindex', '0'); 
            card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${item.poster_path}">`;
            card.onclick = () => openDetails(item);
            card.onkeydown = (e) => { if(e.key === 'Enter') openDetails(item); };
            grid.appendChild(card);
        });
    }

    async function openDetails(item) {
        selected = item;
        document.getElementById('ritual-screen').style.display = 'block';
        document.getElementById('ritual-screen').scrollTo(0,0);
        document.getElementById('det-title').innerText = item.title || item.name;
        document.getElementById('det-desc').innerText = item.overview;
        document.getElementById('det-poster').src = `https://image.tmdb.org/t/p/w500${item.poster_path}`;
        document.getElementById('hero-backdrop').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${item.backdrop_path})`;
        document.getElementById('det-meta').innerText = `${item.release_date || item.first_air_date} | ${item.vote_average}/10`;
        
        if(item.first_air_date) {
            document.getElementById('tv-controls').style.display = 'block';
            const res = await fetch(`https://api.themoviedb.org/3/tv/${item.id}?api_key=${API_KEY}`);
            const data = await res.json();
            document.getElementById('s-row').innerHTML = data.seasons.map(s => `<div class="pill" tabindex="0" onclick="syncEpisodes(${s.season_number}, this)">S${s.season_number}</div>`).join('');
            syncEpisodes(1);
        } else { document.getElementById('tv-controls').style.display = 'none'; }
        saveHistory(item);
        document.getElementById('play-btn').focus(); 
    }

    async function syncEpisodes(sNum, el) {
        currentS = sNum;
        if(el) { document.querySelectorAll('#s-row .pill').forEach(p => p.classList.remove('active')); el.classList.add('active'); }
        const res = await fetch(`https://api.themoviedb.org/3/tv/${selected.id}/season/${sNum}?api_key=${API_KEY}`);
        const data = await res.json();
        document.getElementById('e-row').innerHTML = data.episodes.map(e => `<div class="pill" tabindex="0" onclick="ignitePlayer(${e.episode_number}, this)">E${e.episode_number}</div>`).join('');
    }

    function showPlayer() {
        document.getElementById('player-mount').style.display = 'block';
        ignitePlayer(1);
        document.getElementById('play-btn').style.display = 'none';
        setTimeout(() => document.getElementById('player-mount').scrollIntoView({behavior: 'smooth'}), 300);
    }

    function ignitePlayer(eNum, el) {
        if(el) { document.querySelectorAll('#e-row .pill').forEach(p => p.classList.remove('active')); el.classList.add('active'); }
        const mount = document.getElementById('player-mount');
        mount.style.display = 'block';
        let url = selected.first_air_date ? `https://vidsrc.cc/v2/embed/tv/${selected.id}/${currentS}/${eNum || 1}` : `https://vidsrc.cc/v2/embed/movie/${selected.id}`;
        mount.innerHTML = `<iframe src="${url}" allowfullscreen></iframe>`;
    }

    function saveHistory(i) {
        let h = JSON.parse(localStorage.getItem('fear_history') || '[]');
        h = h.filter(x => x.id !== i.id); h.unshift(i);
        localStorage.setItem('fear_history', JSON.stringify(h.slice(0,10))); renderHistory();
    }

    function renderHistory() {
        const h = JSON.parse(localStorage.getItem('fear_history') || '[]');
        if(h.length === 0) return;
        document.getElementById('resume-ritual').style.display = 'block';
        const grid = document.getElementById('continue-grid');
        grid.innerHTML = '';
        render(h, 'continue-grid');
    }

    function closeRitual() { document.getElementById('ritual-screen').style.display = 'none'; document.getElementById('player-mount').innerHTML = ''; document.getElementById('play-btn').style.display = 'block'; }
    function setMode(m) { mode = m; toggleSideMenu(); load(true); }

    function handleSearch(e) { if(e.key === 'Enter') { document.getElementById('main-grid').innerHTML = ''; fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${e.target.value}`).then(r => r.json()).then(d => render(d.results, 'main-grid')); } }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'm' || e.key === 'ContextMenu' || e.key === 'MediaPlayPause') toggleSideMenu();
        if (e.key === 'Backspace') { if(document.getElementById('side-menu').classList.contains('open')) toggleSideMenu(); else closeRitual(); }
    });

    window.onload = () => { load(); renderHistory(); setTimeout(() => document.getElementById('loader').style.display = 'none', 1000); };
    
    // INFINITE SCROLL OBSERVER
    const obs = new IntersectionObserver(entries => {
        if(entries[0].isIntersecting && !fetching) {
            page++;
            load();
        }
    }, { threshold: 0.1 });
    obs.observe(document.getElementById('sentinel'));
</script>
</body>
</html>
